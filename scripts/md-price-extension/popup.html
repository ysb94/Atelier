<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Atelier 스마트스토어 테스트</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <p class="eyebrow">ATELIER · 수집 방식 테스트</p>
  <h1>현재 상품 읽기</h1>
  <p>열어 둔 마스마룰즈 스마트스토어 상품의 표시 본문을 읽습니다. 결과는 이 PC에만 저장됩니다.</p>
  <button id="capture" type="button">상품 본문 읽기</button>
  <p id="status" role="status">스마트스토어 상품 상세페이지에서 실행하세요.</p>
  <pre id="result" hidden></pre>
  <p class="note">가격 DB에는 아직 반영하지 않습니다. 본문과 실제 화면을 대조한 뒤 가격 최신화 연결을 결정합니다.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
