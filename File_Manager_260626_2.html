      function updateUploadQueueStatus() {
        const pendingRows = getPendingUploadRows()
        const totalRows = fileListDiv.querySelectorAll('.upload-row').length
        const busy = isAppBusy()

        if (totalRows === 0) {
          uploadQueueStatus.textContent = '업로드 대기열 없음'
          btnUploadAll.disabled = true
          return
        }

        uploadQueueStatus.textContent = `대기 ${pendingRows.length}개 / 전체 ${totalRows}개`
        btnUploadAll.disabled = pendingRows.length === 0 || busy
      }

      function getPendingUploadRows() {
        return [...fileListDiv.querySelectorAll('.upload-row')].filter(
          (row) => {
            const uploadButton = row.querySelector('.upload-button')
            return uploadButton && !uploadButton.classList.contains('completed')
          },
        )
      }

      function getPendingUploadJobs() {
        return getPendingUploadRows()
          .map((row) => ({
            row,
            file: row.__uploadFile,
            targetPath: row.__uploadPath,
            uploadButton: row.querySelector('.upload-button'),
          }))
          .filter((job) => job.file && job.targetPath && job.uploadButton)
      }

      function getUploadJobKey(job) {
        return `${job.targetPath}/${job.file.name}`
      }

      function buildUploadUrl(targetPath, fileName, forceOverwrite = false) {
        const encodedPath = String(targetPath)
          .split('/')
          .map((part) => encodeURIComponent(part))
          .join('/')
        const encodedName = encodeURIComponent(fileName)
        let url = `${UPLOAD_WORKER_BASE}/${encodedPath}/${encodedName}`
        if (forceOverwrite) {
          url += '?overwrite=true'
        }
        return url
      }

      const VIDEO_UPLOAD_EXTENSIONS = new Set(['.mp4', '.webm', '.mov', '.m4v'])

      function isVideoFileName(name) {
        const dot = String(name).lastIndexOf('.')
        if (dot === -1) return false
        return VIDEO_UPLOAD_EXTENSIONS.has(
          String(name).slice(dot).toLowerCase(),
        )
      }

      function buildEmbedKeyForUpload(targetPath, fileName) {
        if (!fileName) return null

        const dot = fileName.lastIndexOf('.')
        if (dot === -1) return null

        const base = fileName.slice(0, dot)
        return `embed/${base}.html`
      }

      function buildEmbedHeadUrl(embedKey) {
        const encodedKey = String(embedKey)
          .split('/')
          .map((part) => encodeURIComponent(part))
          .join('/')
        return `${UPLOAD_WORKER_BASE}/${encodedKey}`
      }

      function lookupEmbedExistsInCache(embedKey) {
        const cacheKey = `${getListWorkerBase()}::embed`
        if (!serverListCache.has(cacheKey)) return null

        const embedName = embedKey.startsWith('embed/')
          ? embedKey.slice('embed/'.length)
          : embedKey
        const items = serverListCache.get(cacheKey) || []
        return items.some((item) => {
          const itemKey = item.key || `embed/${item.name || ''}`
          return itemKey === embedKey || item.name === embedName
        })
      }

      async function checkEmbedExists(embedKey) {
        const cached = lookupEmbedExistsInCache(embedKey)
        if (cached === true) return true

        try {
          const res = await fetch(buildEmbedHeadUrl(embedKey), {
            method: 'HEAD',
          })
          return res.ok
        } catch {
          return false
        }
      }

      function lookupExistsInListCache(targetPath, fileName) {
        const type = String(targetPath).split('/')[0]
        if (!type) return null
        const cacheKey = `${getListWorkerBase()}::${type}`
        if (!serverListCache.has(cacheKey)) return null

        const storageKey = `${targetPath}/${fileName}`
        const items = serverListCache.get(cacheKey) || []
        return items.some(
          (item) => getItemStorageKey(item, type) === storageKey,
        )
      }

      async function checkUploadExists(targetPath, fileName) {
        // 목록 캐시가 있으면 HEAD 요청 없이 판정해 Worker 요청을 아낀다.
        const cached = lookupExistsInListCache(targetPath, fileName)
        if (cached === true) return true

        try {
          const res = await fetch(buildUploadUrl(targetPath, fileName), {
            method: 'HEAD',
          })
          return res.ok
        } catch {
          return false
        }
      }

      async function mapWithConcurrency(items, limit, mapper) {
        const results = new Array(items.length)
        let nextIndex = 0

        async function worker() {
          while (nextIndex < items.length) {
            const currentIndex = nextIndex
            nextIndex += 1
            results[currentIndex] = await mapper(
              items[currentIndex],
              currentIndex,
            )
          }
        }

        const workerCount = Math.min(limit, items.length)
        await Promise.all(Array.from({ length: workerCount }, worker))
        return results
      }

      async function classifyUploadConflict(job) {
        const fileExists = await checkUploadExists(
          job.targetPath,
          job.file.name,
        )
        if (fileExists) return 'file'

        if (isVideoFileName(job.file.name)) {
          const embedKey = buildEmbedKeyForUpload(job.targetPath, job.file.name)
          if (embedKey && (await checkEmbedExists(embedKey))) {
            return 'embed'
          }
        }

        return 'none'
      }

      async function findUploadConflicts(jobs) {
        const DUPLICATE_CHECK_CONCURRENCY = 20
        const conflictTypes = await mapWithConcurrency(
          jobs,
          DUPLICATE_CHECK_CONCURRENCY,
          classifyUploadConflict,
        )

        const fileDuplicates = jobs.filter(
          (_, index) => conflictTypes[index] === 'file',
        )
        const embedDuplicates = jobs.filter(
          (_, index) => conflictTypes[index] === 'embed',
        )
        const duplicateKeys = new Set(
          jobs
            .filter((_, index) => conflictTypes[index] !== 'none')
            .map((job) => getUploadJobKey(job)),
        )

        return { fileDuplicates, embedDuplicates, duplicateKeys }
      }

      async function findDuplicateUploadJobs(jobs) {
        const DUPLICATE_CHECK_CONCURRENCY = 20
        const existsFlags = await mapWithConcurrency(
          jobs,
          DUPLICATE_CHECK_CONCURRENCY,
          async (job) => checkUploadExists(job.targetPath, job.file.name),
        )
        return jobs.filter((_, index) => existsFlags[index])
      }

      function findQueueInternalDuplicateKeys(jobs) {
        const seen = new Set()
        const duplicates = new Set()

        for (const job of jobs) {
          const key = getUploadJobKey(job)
          if (seen.has(key)) {
            duplicates.add(key)
          } else {
            seen.add(key)
          }
        }

        return [...duplicates]
      }

      function findQueueInternalEmbedDuplicateKeys(jobs) {
        const seen = new Map()
        const duplicates = new Set()

        for (const job of jobs) {
          if (!isVideoFileName(job.file.name)) continue

          const embedKey = buildEmbedKeyForUpload(job.targetPath, job.file.name)
          if (!embedKey) continue

          const uploadKey = getUploadJobKey(job)
          const previousUploadKey = seen.get(embedKey)
          if (previousUploadKey && previousUploadKey !== uploadKey) {
            duplicates.add(`${previousUploadKey}\n${uploadKey}\n→ ${embedKey}`)
          } else {
            seen.set(embedKey, uploadKey)
          }
        }

        return [...duplicates]
      }

      async function confirmBatchOverwrite(duplicateJobs) {
        const names = duplicateJobs.map((job) => getUploadJobKey(job))
        const preview = names.slice(0, 10).join('\n')
        const extra = names.length > 10 ? `\n... 외 ${names.length - 10}개` : ''
        return uiConfirm(
          `중복 파일 ${names.length}개가 있습니다.\n\n${preview}${extra}\n\n모두 덮어쓸까요?`,
          { title: '덮어쓰기 확인' },
        )
      }

      async function confirmBatchUploadOverwrite(fileDuplicates, embedDuplicates) {
        const parts = []

        if (fileDuplicates.length > 0) {
          const names = fileDuplicates.map((job) => getUploadJobKey(job))
          const preview = names.slice(0, 10).join('\n')
          const extra =
            names.length > 10 ? `\n... 외 ${names.length - 10}개` : ''
          parts.push(
            `[원본 파일 중복]\n업로드하려는 현재 폴더 안에 같은 파일명이 이미 있습니다.\n덮어쓰면 해당 폴더의 기존 파일이 교체됩니다.\n\n중복 ${names.length}개:\n${preview}${extra}`,
          )
        }

        if (embedDuplicates.length > 0) {
          const names = embedDuplicates.map((job) => {
            const embedKey = buildEmbedKeyForUpload(
              job.targetPath,
              job.file.name,
            )
            return `${getUploadJobKey(job)} → ${embedKey}`
          })
          const preview = names.slice(0, 10).join('\n')
          const extra =
            names.length > 10 ? `\n... 외 ${names.length - 10}개` : ''
          parts.push(
            `[태그(embed HTML) 중복]\n원본 파일명은 중복이 아니지만, iframe용 HTML을 embed 폴더에 만들 때 같은 태그 파일명이 이미 있습니다.\n덮어쓰면 기존 iframe 태그 HTML이 교체됩니다. 파일명을 바꿔 넣으면 피할 수 있습니다.\n\n중복 ${names.length}개:\n${preview}${extra}`,
          )
        }

        if (parts.length === 0) return true

        return uiConfirm(`${parts.join('\n\n')}\n\n모두 덮어쓸까요?`, {
          title: '업로드 덮어쓰기 확인',
        })
      }

      async function enqueueFiles(files, targetPath) {
        if (!files || !files.length) return

        if (!targetPath) {
          await uiAlert(
            '업로드할 폴더를 먼저 선택하세요. (왼쪽 사이드바에서 폴더를 열어주세요)',
          )
          return
        }

        for (const file of files) {
          const fileRow = document.createElement('div')
          fileRow.className = 'upload-row'

          const fileLabel = document.createElement('span')
          fileLabel.innerText = `${targetPath}/${file.name}`

          const uploadButton = document.createElement('button')
          uploadButton.className = 'upload-button'
          uploadButton.innerText = '업로드'
          uploadButton.onclick = () =>
            uploadSingleFile(file, targetPath, uploadButton, fileRow)

          const resetButton = document.createElement('button')
          resetButton.className = 'upload-button'
          resetButton.innerText = '삭제'
          resetButton.onclick = () => {
            fileRow.remove()
            updateUploadQueueStatus()
          }

          fileRow.__uploadFile = file
          fileRow.__uploadPath = targetPath

          fileRow.appendChild(fileLabel)
          fileRow.appendChild(uploadButton)
          fileRow.appendChild(resetButton)
          fileListDiv.appendChild(fileRow)
        }

        updateUploadQueueStatus()
      }

      function isOsFileDrop(event) {
        if (suppressExternalDrop) return false
        const dt = event.dataTransfer
        if (!dt) return false

        const types = Array.from(dt.types)
        if (!types.includes('Files')) return false

        // 페이지 안 이미지/파일 카드 드래그는 text/html 또는 text/uri-list가 함께 옴
        if (types.includes('text/html') || types.includes('text/uri-list')) {
          return false
        }

        return (dt.files?.length || 0) > 0
      }

      function hasExternalFiles(event) {
        if (suppressExternalDrop) return false
        if (!event.dataTransfer) return false

        const types = Array.from(event.dataTransfer.types)
        if (!types.includes('Files')) return false

        // 탐색기에서 온 파일은 보통 Files만 포함. 그리드 썸네일 드래그는 html/uri-list도 포함
        if (types.includes('text/html') || types.includes('text/uri-list')) {
          return false
        }

        return true
      }

      function initInternalDragGuard() {
        folderGrid.addEventListener(
          'dragstart',
          (event) => {
            if (!event.target.closest('.file-card')) return
            suppressExternalDrop = true
            event.preventDefault()
            event.stopPropagation()
          },
          true,
        )

        folderGrid.addEventListener('mousedown', (event) => {
          if (!event.target.closest('.file-card')) return
          suppressExternalDrop = false
        })

        document.addEventListener('dragend', () => {
          suppressExternalDrop = false
        })
      }

      function initExternalDropZone() {
        let dragDepth = 0

        const showDropState = () => workspaceArea.classList.add('drop-active')
        const hideDropState = () =>
          workspaceArea.classList.remove('drop-active')

        workspaceArea.addEventListener('dragenter', (event) => {
          if (!hasExternalFiles(event)) return
          event.preventDefault()
          dragDepth += 1
          showDropState()
        })

        workspaceArea.addEventListener('dragover', (event) => {
          if (!hasExternalFiles(event)) return
          event.preventDefault()
          event.dataTransfer.dropEffect = 'copy'
          showDropState()
        })

        workspaceArea.addEventListener('dragleave', (event) => {
          if (!hasExternalFiles(event)) return
          dragDepth -= 1
          if (dragDepth <= 0) {
            dragDepth = 0
            hideDropState()
          }
        })

        workspaceArea.addEventListener('drop', (event) => {
          if (!isOsFileDrop(event)) return
          event.preventDefault()
          dragDepth = 0
          hideDropState()
          enqueueFiles(event.dataTransfer.files, getCurrentUploadPath())
        })
      }

      function clearSelection() {
        selectedItems.clear()
        lastSelectedKey = null
        document
          .querySelectorAll('.grid-card.selected, .grid-card.active')
          .forEach((el) => {
            el.classList.remove('selected', 'active')
          })
        activeCardEl = null
      }

      function syncSelectionAfterRender() {
        const nextSelection = new Map()

        document
          .querySelectorAll('.file-card, .folder-card.selectable')
          .forEach((card) => {
            const key = card.dataset.selectionKey
            if (!key || !selectedItems.has(key)) return

            const prev = selectedItems.get(key)
            card.classList.add('selected')
            nextSelection.set(key, { ...prev, el: card })

            if (
              prev.kind === 'file' &&
              selectedPreview &&
              getItemKey(selectedPreview.item, selectedPreview.type) === key
            ) {
              card.classList.add('active')
              activeCardEl = card
            }
          })

        selectedItems = nextSelection
        updateGridToolbar()
      }

      function addCardToSelection(cardEl, options = {}) {
        const key = cardEl.dataset.selectionKey
        if (!key) return

        if (key.startsWith('browse::')) {
          addBrowseTypeToSelection(key.slice(8), cardEl, options)
          return
        }

        const folderInfo = parseFolderSelectionKey(key)
        if (folderInfo) {
          addFolderToSelection(
            folderInfo.folder,
            folderInfo.type,
            cardEl,
            options,
          )
          return
        }

        const found = findItemByKey(key)
        if (found) {
          addToSelection(found.item, found.type, cardEl, options)
        }
      }

      function addToSelection(item, type, cardEl, options = {}) {
        const { toggle = false, append = false } = options
        const key = getItemKey(item, type)

        if (toggle && selectedItems.has(key)) {
          selectedItems.delete(key)
          cardEl?.classList.remove('selected', 'active')
          if (
            selectedPreview &&
            getItemKey(selectedPreview.item, selectedPreview.type) === key
          ) {
            const remaining = [...selectedItems.values()].filter(
              (entry) => entry.kind === 'file' || entry.item,
            )
            selectedPreview = remaining.length
              ? {
                  item: remaining[remaining.length - 1].item,
                  type: remaining[remaining.length - 1].type,
                }
              : null
            renderPreview(selectedPreview)
          }
          updateGridToolbar()
          return
        }

        if (!append && !toggle) {
          clearSelection()
        }

        selectedItems.set(key, { kind: 'file', item, type, el: cardEl })
        cardEl?.classList.add('selected')
        lastSelectedKey = key
        selectedPreview = { item, type }

        document
          .querySelectorAll('.file-card.active')
          .forEach((el) => el.classList.remove('active'))
        cardEl?.classList.add('active')
        activeCardEl = cardEl
        renderPreview(selectedPreview)
        updateGridToolbar()
      }

      function addFolderToSelection(folder, type, cardEl, options = {}) {
        const { toggle = false, append = false } = options
        const key = getFolderSelectionKey(folder, type)

        if (toggle && selectedItems.has(key)) {
          selectedItems.delete(key)
          cardEl?.classList.remove('selected', 'active')
          updateGridToolbar()
          return
        }

        if (!append && !toggle) {
          clearSelection()
        }

        selectedItems.set(key, { kind: 'folder', folder, type, el: cardEl })
        cardEl?.classList.add('selected')
        lastSelectedKey = key
        updateGridToolbar()
      }

      function addBrowseTypeToSelection(browseType, cardEl, options = {}) {
        const { toggle = false, append = false } = options
        const key = getBrowseTypeSelectionKey(browseType)

        if (toggle && selectedItems.has(key)) {
          selectedItems.delete(key)
          cardEl?.classList.remove('selected', 'active')
          updateGridToolbar()
          return
        }

        if (!append && !toggle) {
          clearSelection()
        }

        selectedItems.set(key, { kind: 'browse', browseType, el: cardEl })
        cardEl?.classList.add('selected')
        lastSelectedKey = key
        updateGridToolbar()
      }

      function selectAllVisibleItems() {
        if (isAppBusy()) return

        const cards = getSelectableCards()
        if (cards.length === 0) return

        clearSelection()
        cards.forEach((card, index) => {
          addCardToSelection(card, { append: index !== 0 })
        })
      }

      function selectRangeToCard(targetCard) {
        const cards = getSelectableCards()
        const targetKey = targetCard.dataset.selectionKey
        const anchorKey = lastSelectedKey || targetKey
        const startIndex = cards.findIndex(
          (card) => card.dataset.selectionKey === anchorKey,
        )
        const endIndex = cards.findIndex(
          (card) => card.dataset.selectionKey === targetKey,
        )

        if (startIndex === -1 || endIndex === -1) {
          addCardToSelection(targetCard)
          return
        }

        const [from, to] =
          startIndex < endIndex
            ? [startIndex, endIndex]
            : [endIndex, startIndex]
        clearSelection()

        for (let index = from; index <= to; index += 1) {
          addCardToSelection(cards[index], { append: index !== from })
        }
      }

      function findItemByKey(key) {
        for (const group of currentGroups) {
          for (const item of group.items) {
            if (getItemKey(item, currentServerType) === key) {
              return { item, type: currentServerType }
            }
          }
        }
        return null
      }

      function handleFileCardClick(event, item, type, cardEl) {
        if (isAppBusy()) return

        event.stopPropagation()

        if (event.shiftKey) {
          selectRangeToCard(cardEl)
          return
        }

        if (event.ctrlKey || event.metaKey) {
          addToSelection(item, type, cardEl, { toggle: true, append: true })
          return
        }

        addToSelection(item, type, cardEl)
      }

      function handleFolderCardClick(event, folder, type, cardEl) {
        if (isAppBusy()) return

        event.preventDefault()
        event.stopPropagation()

        if (event.shiftKey) {
          selectRangeToCard(cardEl)
          return
        }

        if (event.ctrlKey || event.metaKey) {
          addFolderToSelection(folder, type, cardEl, {
            toggle: true,
            append: true,
          })
          return
        }

        addFolderToSelection(folder, type, cardEl)
      }

      function handleBrowseTypeCardClick(event, browseType, cardEl) {
        if (isAppBusy()) return

        event.preventDefault()
        event.stopPropagation()

        if (event.shiftKey) {
          selectRangeToCard(cardEl)
          return
        }

        if (event.ctrlKey || event.metaKey) {
          addBrowseTypeToSelection(browseType, cardEl, {
            toggle: true,
            append: true,
          })
          return
        }

        addBrowseTypeToSelection(browseType, cardEl)
      }

      function initMarqueeSelection() {
        let marqueeState = null

        const cleanupMarquee = () => {
          if (marqueeState?.rect) {
            marqueeState.rect.remove()
          }
          document
            .querySelectorAll(
              '.file-card.marquee-candidate, .folder-card.marquee-candidate',
            )
            .forEach((card) => {
              card.classList.remove('marquee-candidate')
            })
          marqueeState = null
        }

        const getMarqueeRect = (event) => {
          const left = Math.min(marqueeState.startX, event.clientX)
          const top = Math.min(marqueeState.startY, event.clientY)
          const width = Math.abs(event.clientX - marqueeState.startX)
          const height = Math.abs(event.clientY - marqueeState.startY)
          return {
            left,
            top,
            right: left + width,
            bottom: top + height,
            width,
            height,
          }
        }

        const highlightMarqueeIntersect = (event) => {
          const marqueeRect = getMarqueeRect(event)
          document
            .querySelectorAll('.file-card, .folder-card.selectable')
            .forEach((card) => {
              const cardRect = card.getBoundingClientRect()
              const intersects = !(
                cardRect.left > marqueeRect.right ||
                cardRect.right < marqueeRect.left ||
                cardRect.top > marqueeRect.bottom ||
                cardRect.bottom < marqueeRect.top
              )
              card.classList.toggle('marquee-candidate', intersects)
            })
        }

        const finalizeMarqueeSelection = (event) => {
          if (!event.ctrlKey && !event.metaKey) {
            clearSelection()
          }

          document
            .querySelectorAll(
              '.file-card.marquee-candidate, .folder-card.marquee-candidate',
            )
            .forEach((card) => {
              addCardToSelection(card, { append: true })
            })
        }

        folderGrid.addEventListener('mousedown', (event) => {
          if (event.button !== 0) return
          if (event.target.closest('.file-card')) return
          if (event.target.closest('.folder-card')) return
          if (event.target.closest('.load-more-card')) return

          marqueeState = {
            startX: event.clientX,
            startY: event.clientY,
            active: false,
            rect: null,
          }

          const onMove = (moveEvent) => {
            if (!marqueeState) return
            const dx = Math.abs(moveEvent.clientX - marqueeState.startX)
            const dy = Math.abs(moveEvent.clientY - marqueeState.startY)

            if (!marqueeState.active) {
              if (dx < MARQUEE_THRESHOLD && dy < MARQUEE_THRESHOLD) return
              marqueeState.active = true
              marqueeState.rect = document.createElement('div')
              marqueeState.rect.className = 'marquee-select'
              document.body.appendChild(marqueeState.rect)
            }

            const marqueeRect = getMarqueeRect(moveEvent)
            Object.assign(marqueeState.rect.style, {
              left: `${marqueeRect.left}px`,
              top: `${marqueeRect.top}px`,
              width: `${marqueeRect.width}px`,
              height: `${marqueeRect.height}px`,
            })
            highlightMarqueeIntersect(moveEvent)
          }

          const onUp = (upEvent) => {
            if (marqueeState?.active) {
              finalizeMarqueeSelection(upEvent)
            }
            cleanupMarquee()
            document.removeEventListener('mousemove', onMove)
            document.removeEventListener('mouseup', onUp)
          }

          document.addEventListener('mousemove', onMove)
          document.addEventListener('mouseup', onUp)
        })
      }

      function ensureTagBreak(tag) {
        const trimmed = String(tag || '').trim()
        if (!trimmed) return '<br>'
        return /<br\s*\/?>$/i.test(trimmed) ? trimmed : `${trimmed}<br>`
      }

      function addTagEntry(item, type) {
        const url = getItemPublicUrl(item, type)
        const tag = ensureTagBreak(buildMediaTag(type, url, item))
        accumulatedTags.push({
          uid: ++tagUidCounter,
          item,
          type,
          url,
          tag,
        })
        renderTagList()
      }

      function refreshAccumulatedTagEntry(entry) {
        if (!entry?.item || !entry?.type) {
          return ensureTagBreak(entry?.tag || '')
        }

        const url = getItemPublicUrl(entry.item, entry.type)
        const tag = ensureTagBreak(buildMediaTag(entry.type, url, entry.item))
        entry.url = url
        entry.tag = tag
        return tag
      }

      function addSelectedToTags() {
        const fileSelections = [...selectedItems.values()].filter(
          (entry) => entry.kind === 'file' || entry.item,
        )
        if (fileSelections.length === 0) return

        for (const { item, type } of fileSelections) {
          addTagEntry(item, type)
        }
      }

      function renderTagList() {
        tagListEl.replaceChildren()

        if (accumulatedTags.length === 0) {
          const empty = document.createElement('div')
          empty.className = 'tag-list-empty'
          empty.textContent = '태그 넣기 버튼으로 태그를 추가하세요.'
          tagListEl.appendChild(empty)
          return
        }

        let dragSourceUid = null

        accumulatedTags.forEach((entry) => {
          const row = document.createElement('div')
          row.className = 'tag-row'
          if (activeTagUid === entry.uid) row.classList.add('active')
          row.dataset.uid = String(entry.uid)

          const handle = document.createElement('span')
          handle.className = 'tag-drag-handle'
          handle.textContent = '≡'
          handle.title = '드래그하여 순서 변경'

          const body = document.createElement('button')
          body.type = 'button'
          body.className = 'tag-body'
          const displayTag = refreshAccumulatedTagEntry(entry)
          body.textContent = displayTag
          body.title = displayTag.replace(/<br\s*\/?>$/i, '')
          body.onclick = () => {
            activeTagUid = entry.uid
            renderTagList()
            renderPreview({ item: entry.item, type: entry.type })
          }

          const deleteBtn = document.createElement('button')
          deleteBtn.type = 'button'
          deleteBtn.className = 'tag-delete'
          deleteBtn.textContent = '×'
          deleteBtn.title = '태그 삭제'
          deleteBtn.onclick = (event) => {
            event.stopPropagation()
            accumulatedTags = accumulatedTags.filter(
              (tagEntry) => tagEntry.uid !== entry.uid,
            )
            if (activeTagUid === entry.uid) activeTagUid = null
            renderTagList()
          }

          row.addEventListener('dragstart', (event) => {
            dragSourceUid = entry.uid
            row.classList.add('dragging')
            event.dataTransfer.effectAllowed = 'move'
            event.dataTransfer.setData('text/plain', String(entry.uid))
          })

          row.addEventListener('dragend', () => {
            dragSourceUid = null
            row.classList.remove('dragging')
            tagListEl
              .querySelectorAll('.tag-row.drag-over')
              .forEach((el) => el.classList.remove('drag-over'))
          })

          row.addEventListener('dragover', (event) => {
            event.preventDefault()
            event.dataTransfer.dropEffect = 'move'
            tagListEl
              .querySelectorAll('.tag-row.drag-over')
              .forEach((el) => el.classList.remove('drag-over'))
            if (dragSourceUid !== entry.uid) {
              row.classList.add('drag-over')
            }
          })

          row.addEventListener('dragleave', () => {
            row.classList.remove('drag-over')
          })

          row.addEventListener('drop', (event) => {
            event.preventDefault()
            row.classList.remove('drag-over')
            const sourceUid = Number(
              event.dataTransfer.getData('text/plain') || dragSourceUid,
            )
            const targetUid = entry.uid
            if (!sourceUid || sourceUid === targetUid) return

            const fromIndex = accumulatedTags.findIndex(
              (tagEntry) => tagEntry.uid === sourceUid,
            )
            const toIndex = accumulatedTags.findIndex(
              (tagEntry) => tagEntry.uid === targetUid,
            )
            if (fromIndex === -1 || toIndex === -1) return

            const [moved] = accumulatedTags.splice(fromIndex, 1)
            accumulatedTags.splice(toIndex, 0, moved)
            renderTagList()
          })

          handle.draggable = true
          handle.addEventListener('mousedown', (event) =>
            event.stopPropagation(),
          )
          handle.addEventListener('dragstart', (event) => {
            dragSourceUid = entry.uid
            row.classList.add('dragging')
            event.dataTransfer.effectAllowed = 'move'
            event.dataTransfer.setData('text/plain', String(entry.uid))
          })

          row.appendChild(handle)
          row.appendChild(body)
          row.appendChild(deleteBtn)
          tagListEl.appendChild(row)
        })
      }

      function formatFileSize(bytes) {
        if (bytes == null || Number.isNaN(bytes)) return '-'
        if (bytes < 1024) return `${bytes} B`
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`
      }

      function formatUploadedDate(value) {
        if (!value) return ''
        const date = new Date(value)
        if (Number.isNaN(date.getTime())) return ''
        return date.toLocaleString('ko-KR')
      }

      function buildPublicUrl(storageKey) {
        const encodedKey = String(storageKey)
          .split('/')
          .map((part) => encodeURIComponent(part))
          .join('/')
        return `${CDN_BASE}/${encodedKey}`
      }

      function buildWorkerAssetUrl(storageKey) {
        const encodedKey = String(storageKey)
          .split('/')
          .map((part) => encodeURIComponent(part))
          .join('/')
        return `${UPLOAD_WORKER_BASE}/${encodedKey}`
      }

      function getItemStorageKey(item, type) {
        if (item.key) return item.key

        const relative =
          item.relativePath || item.name || item.displayName || ''
        if (relative.includes('/')) {
          return `${type}/${relative}`
        }

        if (activeFolder && activeBrowseType === type) {
          return `${type}/${activeFolder}/${relative}`
        }

        return `${type}/${relative}`
      }

      function getItemPublicUrl(item, type) {
        const storageKey = getItemStorageKey(item, type)
        return buildPublicUrl(storageKey)
      }

      function getItemDisplayUrl(item, type) {
        const storageKey = getItemStorageKey(item, type)
        if (isVideoItem(item, type)) {
          return buildWorkerAssetUrl(storageKey)
        }
        return buildPublicUrl(storageKey)
      }

      function getItemUrl(item, type) {
        return getItemPublicUrl(item, type)
      }

      function buildMediaTag(type, url, item = null) {
        if (item && isVideoItem(item, type)) {
          return `<video src="${url}" controls></video>`
        }
        if (type === 'video') {
          return `<video src="${url}" controls></video>`
        }
        return `<img src="${url}">`
      }

      function setSidebarStatus(message, kind = 'info') {
        sidebarStatus.textContent = message
        sidebarStatus.className = 'sidebar-status'
        if (kind === 'error') sidebarStatus.classList.add('error')
        if (kind === 'loading') sidebarStatus.classList.add('loading')
      }

      function normalizeWorkerBase(value) {
        return value.trim().replace(/\/+$/, '')
      }

      function getListWorkerBase() {
        const saved = localStorage.getItem(LIST_WORKER_STORAGE_KEY)
        return normalizeWorkerBase(saved || DEFAULT_LIST_WORKER_BASE)
      }

      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text)
            return true
          } catch {}
        }

        try {
          const textarea = document.createElement('textarea')
          textarea.value = text
          textarea.style.position = 'fixed'
          textarea.style.left = '-9999px'
          document.body.appendChild(textarea)
          textarea.focus()
          textarea.select()
          const ok = document.execCommand('copy')
          document.body.removeChild(textarea)
          return ok
        } catch {
          return false
        }
      }

      async function fetchTopLevelFolders() {
        const listWorkerBase = getListWorkerBase()
        const res = await fetch(`${listWorkerBase}/folders`)
        if (res.status === 404 || res.status === 405) {
          throw new Error('FOLDERS_API_NOT_READY')
        }
        if (!res.ok) {
          throw new Error(`HTTP_${res.status}`)
        }
        const data = await res.json()
        if (!data || !Array.isArray(data.folders)) {
          throw new Error('INVALID_RESPONSE')
        }
        return data.folders
      }

      async function loadBrowseTypes() {
        try {
          const folders = await fetchTopLevelFolders()
          const merged = [...DEFAULT_BROWSE_TYPES]
          for (const folder of folders) {
            if (
              folder &&
              !HIDDEN_BROWSE_TYPES.has(folder) &&
              !merged.includes(folder)
            ) {
              merged.push(folder)
            }
          }
          BROWSE_TYPES = merged
        } catch {
          BROWSE_TYPES = [...DEFAULT_BROWSE_TYPES]
        }

        if (!activeBrowseType) {
          renderExplorerGrid()
        } else {
          renderTree()
        }
      }

      async function fetchServerFiles(type) {
        const listWorkerBase = getListWorkerBase()
        const res = await fetch(
          `${listWorkerBase}/list?type=${encodeURIComponent(type)}`,
        )
        if (res.status === 404 || res.status === 405) {
          throw new Error('LIST_API_NOT_READY')
        }
        if (!res.ok) {
          throw new Error(`HTTP_${res.status}`)
        }
        const data = await res.json()
        if (!data || !Array.isArray(data.items)) {
          throw new Error('INVALID_RESPONSE')
        }
        return data.items
      }

      function getRelativePath(item, type) {
        const source = item.key || `${type}/${item.name || ''}`
        const prefixes = [`${R2_BRAND_ROOT}/${type}/`, `${type}/`]

        for (const prefix of prefixes) {
          if (source.startsWith(prefix)) {
            return source.slice(prefix.length)
          }
        }

        return item.name || source
      }

      function splitFolderAndFile(relativePath) {
        const lastSlash = relativePath.lastIndexOf('/')

        if (lastSlash === -1) {
          return { folder: ROOT_FOLDER, fileName: relativePath }
        }

        return {
          folder: relativePath.slice(0, lastSlash),
          fileName: relativePath.slice(lastSlash + 1),
        }
      }

      function groupItemsByFolder(items, type) {
        const groups = new Map()
        const ensureGroup = (folder) => {
          if (!groups.has(folder)) {
            groups.set(folder, [])
          }
        }

        for (const item of items) {
          const relativePath = getRelativePath(item, type)

          // R2 폴더 마커(키가 '/'로 끝나는 0바이트 객체)는 파일이 아니라 빈 폴더로 취급
          if (relativePath.endsWith('/')) {
            const folderName = relativePath.replace(/\/+$/, '')
            if (folderName) ensureGroup(folderName)
            continue
          }

          const { folder, fileName } = splitFolderAndFile(relativePath)
          ensureGroup(folder)

          groups.get(folder).push({
            ...item,
            displayName: fileName,
            relativePath,
          })
        }

        const folders = Array.from(groups.keys()).sort((a, b) => {
          if (a === ROOT_FOLDER) return 1
          if (b === ROOT_FOLDER) return -1
          return a.localeCompare(b, 'ko')
        })

        return folders.map((folder) => ({
          folder,
          items: groups
            .get(folder)
            .sort((a, b) => a.displayName.localeCompare(b.displayName, 'ko')),
        }))
      }

      function itemMatchesSearch(item) {
        const query = fileSearchInput.value.trim().toLowerCase()
        if (!query) return true

        const target =
          `${item.displayName || ''} ${item.relativePath || ''} ${item.name || ''}`.toLowerCase()
        return target.includes(query)
      }

      function getVisibleItems(items) {
        return items.filter(itemMatchesSearch)
      }

      function sortItemsForGrid(items) {
        const list = [...items]

        switch (gridSortMode) {
          case 'name-desc':
            return list.sort((a, b) =>
              (b.displayName || '').localeCompare(a.displayName || '', 'ko'),
            )
          case 'date':
            return list.sort(
              (a, b) => new Date(b.uploaded || 0) - new Date(a.uploaded || 0),
            )
          case 'date-desc':
            return list.sort(
              (a, b) => new Date(a.uploaded || 0) - new Date(b.uploaded || 0),
            )
          case 'name':
          default:
            return list.sort((a, b) =>
              (a.displayName || '').localeCompare(b.displayName || '', 'ko'),
            )
        }
      }

      function applyGridViewClass() {
        folderGrid.classList.remove('view-large', 'view-list')
        if (gridViewMode === 'large') folderGrid.classList.add('view-large')
        if (gridViewMode === 'list') folderGrid.classList.add('view-list')
      }

      function syncGridViewControls() {
        if (gridSortSelect) gridSortSelect.value = gridSortMode
        ;[btnViewNormal, btnViewLarge, btnViewList].forEach((btn) => {
          if (btn) btn.classList.remove('active')
        })

        const activeBtn =
          gridViewMode === 'large'
            ? btnViewLarge
            : gridViewMode === 'list'
              ? btnViewList
              : btnViewNormal

        if (activeBtn) activeBtn.classList.add('active')
      }

      function setGridSort(mode) {
        gridSortMode = mode
        localStorage.setItem(GRID_SORT_KEY, mode)
        renderExplorerGrid()
      }

      function setGridView(mode) {
        gridViewMode = mode
        localStorage.setItem(GRID_VIEW_KEY, mode)
        applyGridViewClass()
        syncGridViewControls()
        renderExplorerGrid()
      }

      function setBreadcrumb(folder = activeFolder) {
        let path = R2_BRAND_ROOT
        if (activeBrowseType) {
          path += ` / <strong>${activeBrowseType}</strong>`
        }
        if (folder) {
          path += ` / <strong>${folder}</strong>`
        }
        breadcrumb.innerHTML = path
      }

      function selectBrowseType(type) {
        if (isAppBusy()) return

        activeBrowseType = type
        activeFolder = null
        clearSelection()
        selectedPreview = null
        gridVisibleLimit = GRID_BATCH_SIZE
        updateGridToolbar()

        if (!type) {
          currentGroups = []
          setSidebarStatus('타입을 선택하세요.')
          renderExplorerGrid()
          renderPreview(null)
          return
        }

        refreshServerFiles()
      }

      function selectFolder(folder) {
        if (isAppBusy()) return

        activeFolder = folder
        clearSelection()
        selectedPreview = null
        gridVisibleLimit = GRID_BATCH_SIZE
        updateGridToolbar()
        renderExplorerGrid()
        renderPreview(null)
      }

      function createTreeButton(label, icon, onClick, active = false) {
        const button = document.createElement('button')
        button.type = 'button'
        button.className = active ? 'tree-item active' : 'tree-item'

        const iconEl = document.createElement('span')
        iconEl.className = 'tree-icon'
        iconEl.textContent = icon

        const nameEl = document.createElement('span')
        nameEl.className = 'tree-name'
        nameEl.textContent = label

        button.appendChild(iconEl)
        button.appendChild(nameEl)
        button.onclick = onClick
        return button
      }

      function appendFolderTreeNodes(parentFolder, container) {
        for (const folder of getImmediateChildFolders(parentFolder)) {
          const items = getFolderGroupItems(folder)
          const folderButton = createTreeButton(
            `${getFolderDisplayName(folder)} (${items.length})`,
            '·',
            () => selectFolder(folder),
            activeFolder === folder,
          )
          attachFolderContextMenu(folderButton, activeBrowseType, folder)
          container.appendChild(folderButton)

          const childFolders = getImmediateChildFolders(folder)
          if (childFolders.length > 0) {
            const childContainer = document.createElement('div')
            childContainer.className = 'tree-children'
            appendFolderTreeNodes(folder, childContainer)
            container.appendChild(childContainer)
          }
        }
      }

      function renderTree() {
        const root = document.createElement('div')
        root.className = 'tree-root'
        root.appendChild(
          createTreeButton(
            R2_BRAND_ROOT,
            '▾',
            () => selectBrowseType(null),
            !activeBrowseType,
          ),
        )

        const typeChildren = document.createElement('div')
        typeChildren.className = 'tree-children'

        for (const browseType of BROWSE_TYPES) {
          const isActiveType = activeBrowseType === browseType
          const typeButton = createTreeButton(
            browseType,
            isActiveType ? '▾' : '▸',
            () => selectBrowseType(browseType),
            isActiveType && !activeFolder,
          )
          attachBrowseTypeContextMenu(typeButton, browseType)
          typeChildren.appendChild(typeButton)

          if (isActiveType) {
            const subChildren = document.createElement('div')
            subChildren.className = 'tree-children'
            appendFolderTreeNodes(null, subChildren)
            typeChildren.appendChild(subChildren)
          }
        }

        root.appendChild(typeChildren)
        serverFileList.replaceChildren(root)
      }

      function getFolderDisplayName(folder) {
        if (folder === ROOT_FOLDER) return '루트'
        const lastSlash = folder.lastIndexOf('/')
        return lastSlash === -1 ? folder : folder.slice(lastSlash + 1)
      }

      function getParentFolderPath(folder) {
        if (!folder) return null
        const lastSlash = folder.lastIndexOf('/')
        if (lastSlash === -1) return null
        return folder.slice(0, lastSlash)
      }

      function updateGridToolbar() {
        const busy = isAppBusy()
        const fileSelectionCount = [...selectedItems.values()].filter(
          (entry) => entry.kind === 'file' || entry.item,
        ).length
        const selectedCount = selectedItems.size
        const enabled = !!selectedPreview && !busy

        btnAddTags.disabled = fileSelectionCount === 0 || busy
        btnAddTags.textContent =
          fileSelectionCount > 0
            ? `태그 넣기 (${fileSelectionCount})`
            : '태그 넣기'
        btnDeleteSelected.disabled = selectedCount === 0 || busy
        btnDeleteSelected.textContent =
          selectedCount > 0 ? `선택 삭제 (${selectedCount})` : '선택 삭제'
        if (btnNewFolder) btnNewFolder.disabled = busy
        btnOpenFile.disabled = !enabled
        if (btnSelectAll) {
          btnSelectAll.disabled =
            getSelectableCards().length === 0 || busy
        }
      }

        card.className = 'grid-card'
        card.title = '상위 폴더'

        thumb.className = 'grid-thumb'

        name.className = 'grid-name'

      function isVideoItem(item, type) {
        return (
          type === 'video' ||
          /\.(mp4|webm|mov)$/i.test(item.displayName || item.name || '')
        )
      }

      function isImageItem(item, type) {
        return (
          type === 'image' ||
          type === 'spin360' ||
          /\.(jpg|jpeg|png|gif|webp)$/i.test(
            item.displayName || item.name || '',
          )
        )
      }

      function isGifItem(item) {
        return /\.gif$/i.test(item.displayName || item.name || '')
      }

      const FILE_TYPE_ICON_META = {
        mp4: { icon: '🎬', title: '동영상' },
        webm: { icon: '🎬', title: '동영상' },
        mov: { icon: '🎬', title: '동영상' },
        m4v: { icon: '🎬', title: '동영상' },
        gif: { icon: '🎞️', title: 'GIF' },
        jpg: { icon: '🖼️', title: '이미지' },
        jpeg: { icon: '🖼️', title: '이미지' },
        png: { icon: '🖼️', title: '이미지' },
        webp: { icon: '🖼️', title: '이미지' },
        avif: { icon: '🖼️', title: '이미지' },
        svg: { icon: '🖼️', title: '이미지' },
        html: { icon: '📄', title: 'HTML' },
        htm: { icon: '📄', title: 'HTML' },
        zip: { icon: '🗜️', title: '압축 파일' },

      }

      const DEFAULT_FILE_ICON_META = { icon: '📎', title: '파일' }

      function getItemFileName(item) {
        if (!item) return ''
        for (const field of ['displayName', 'name', 'relativePath', 'key']) {
          const value = item[field]
          if (typeof value === 'string' && value.trim()) {
            const base = value.split('/').pop() || value
            if (base && !base.endsWith('/')) return base
          }
        }
        return ''
      }

      function getItemExtension(item) {
        const fileName = getItemFileName(item)
        const dot = fileName.lastIndexOf('.')
        if (dot <= 0 || dot === fileName.length - 1) return ''
        return fileName.slice(dot + 1).toLowerCase()
      }

      function getFileTypeIconMetaByExtension(ext) {
        if (!ext) return DEFAULT_FILE_ICON_META
        return FILE_TYPE_ICON_META[ext] || DEFAULT_FILE_ICON_META
      }

      function getListTypeIconMeta(item, type, kind = 'file') {
        if (kind === 'parent') return { icon: '↩', title: '상위 폴더' }
        if (kind === 'folder') return { icon: '📁', title: '폴더' }
        if (kind === 'browse') {
          return { icon: '📁', title: `${type || '타입'} 폴더` }
        }

        return getFileTypeIconMetaByExtension(getItemExtension(item))
      }

      function createListTypeIcon(meta) {
        const el = document.createElement('span')
        el.className = 'grid-list-type-icon'
        el.textContent = meta.icon
        el.title = meta.title
        el.setAttribute('aria-hidden', 'true')
        return el
      }

      function getVideoThumbObserver() {
        if (videoThumbObserver) return videoThumbObserver
        if (!folderGrid || typeof IntersectionObserver === 'undefined')
          return null

        videoThumbObserver = new IntersectionObserver(
          (entries, observer) => {
            for (const entry of entries) {
              if (!entry.isIntersecting) continue

              const video = entry.target
              if (!(video instanceof HTMLVideoElement)) continue
              if (video.dataset.thumbLoaded === 'true') {
                observer.unobserve(video)
                continue
              }

              const thumbEl = video.parentElement
              video.dataset.thumbLoaded = 'true'
              prepareVideoThumbnail(video, thumbEl)
              observer.unobserve(video)
            }
          },
          {
            root: folderGrid,
            rootMargin: '200px',
          },
        )

        return videoThumbObserver
      }

      function disconnectVideoThumbObserver() {
        if (videoThumbObserver) {
          videoThumbObserver.disconnect()
        }
      }

      function prepareVideoThumbnail(video, thumbEl) {
        const pendingSrc = video.dataset.src
        if (pendingSrc && !video.getAttribute('src')) {
          video.src = pendingSrc
        }

        video.muted = true
        video.playsInline = true
        video.preload = 'metadata'
        video.draggable = false

        if (thumbEl) {
          thumbEl.classList.add('video-thumb', 'loading-video')
        }

        const markReady = () => {
          if (thumbEl) thumbEl.classList.remove('loading-video')
        }

        const seekToFirstFrame = () => {
          const duration = video.duration
          if (Number.isFinite(duration) && duration > 0) {
            video.currentTime = Math.min(0.1, duration * 0.01)
          } else {
            video.currentTime = 0.1
          }
        }

        video.addEventListener(
          'loadedmetadata',
          () => {
            try {
              seekToFirstFrame()
            } catch {
              markReady()
            }
          },
          { once: true },
        )

        video.addEventListener('seeked', markReady, { once: true })
        video.addEventListener('loadeddata', markReady, { once: true })
        video.addEventListener('error', markReady, { once: true })
      }

      function createFileCard(item, type, options = {}) {
        const url = getItemDisplayUrl(item, type)
        const itemKey = getItemKey(item, type)
        const card = document.createElement('div')
        const isActive =
          selectedPreview &&
          getItemKey(selectedPreview.item, selectedPreview.type) === itemKey
        const isSelected = selectedItems.has(itemKey)
        card.className = 'grid-card file-card'
        if (isActive) card.classList.add('active')
        if (isSelected) card.classList.add('selected')
        card.dataset.fileKey = itemKey
        card.dataset.selectionKey = itemKey
        card.draggable = false
        if (isActive) activeCardEl = card
        card.title = options.locationLabel
          ? `${options.locationLabel}\n${item.displayName || item.name || 'unknown'}`
          : item.displayName || item.name || 'unknown'
        card.onclick = (event) => handleFileCardClick(event, item, type, card)
        card.ondblclick = (event) => {
          event.preventDefault()
          window.open(url, '_blank', 'noopener')
        }
        attachFileContextMenu(card, item, type)

        const isListView = gridViewMode === 'list'
        const thumb = document.createElement('div')
        thumb.className = 'grid-thumb'

        if (!isListView) {
          if (isVideoItem(item, type)) {
            const video = document.createElement('video')
            video.dataset.src = url
            video.muted = true
            video.playsInline = true
            video.preload = 'metadata'
            video.draggable = false
            thumb.classList.add('video-thumb', 'loading-video')
            thumb.appendChild(video)

            const observer = getVideoThumbObserver()
            if (observer) {
              observer.observe(video)
            } else {
              video.dataset.thumbLoaded = 'true'
              prepareVideoThumbnail(video, thumb)
            }
          } else if (isImageItem(item, type)) {
            const img = document.createElement('img')
            img.src = url
            img.alt = item.displayName
            img.loading = 'lazy'
            img.decoding = 'async'
            img.draggable = false
            thumb.appendChild(img)
          } else {
            const icon = document.createElement('div')
            icon.className = 'grid-icon-file'
            icon.textContent = '▣'
            thumb.appendChild(icon)
          }
        }

        const nameWrap = document.createElement('div')
        nameWrap.className = 'grid-name-wrap'

        const name = document.createElement('div')
        name.className = 'grid-name'
        name.textContent = item.displayName || item.name || 'unknown'
        nameWrap.appendChild(name)

        if (options.locationLabel) {
          const path = document.createElement('div')
          path.className = 'grid-path'
          path.textContent = options.locationLabel
          nameWrap.appendChild(path)
        }

        if (isListView) {
          card.appendChild(
            createListTypeIcon(getListTypeIconMeta(item, type, 'file')),
          )
        } else {
          card.appendChild(thumb)
        }
        card.appendChild(nameWrap)
        return card
      }

      function createLoadMoreCard(hiddenCount) {
        const card = document.createElement('button')
        card.type = 'button'
        card.className = 'grid-card load-more-card'
        card.innerHTML = `<strong>더 보기</strong>${hiddenCount}개 파일 더 있음`
        card.onclick = () => {
          gridVisibleLimit += GRID_BATCH_SIZE
          renderExplorerGrid()
        }
        return card
      }

      function createBrowseTypeCard(browseType) {
        const selectionKey = getBrowseTypeSelectionKey(browseType)
        const isSelected = selectedItems.has(selectionKey)
        const card = document.createElement('div')
        card.className = 'grid-card folder-card selectable browse-type-card'
        if (isSelected) card.classList.add('selected')
        card.dataset.selectionKey = selectionKey
        card.title = `${R2_BRAND_ROOT}/${browseType}`
        card.onclick = (event) =>
          handleBrowseTypeCardClick(event, browseType, card)
        card.ondblclick = (event) => {
          event.preventDefault()
          selectBrowseType(browseType)
        }
        attachBrowseTypeContextMenu(card, browseType)

        const thumb = document.createElement('div')
        thumb.className = 'grid-thumb'

        const icon = document.createElement('div')
        icon.className = 'grid-icon-folder'
        thumb.appendChild(icon)

        const name = document.createElement('div')
        name.className = 'grid-name'
        name.textContent = browseType

        const isListView = gridViewMode === 'list'
        if (isListView) {
          card.appendChild(
            createListTypeIcon(getListTypeIconMeta(null, browseType, 'browse')),
          )
        } else {
          card.appendChild(thumb)
        }
        card.appendChild(name)
        return card
      }

      function renderExplorerGrid() {
        if (isGlobalSearchActive()) {
          renderGlobalSearchResults()
          return
        }

        setBreadcrumb()
        activeCardEl = null
        disconnectVideoThumbObserver()
        const fragment = document.createDocumentFragment()

        if (!activeBrowseType) {
          for (const browseType of BROWSE_TYPES) {
            fragment.appendChild(createBrowseTypeCard(browseType))
          }
          folderGrid.replaceChildren(fragment)
          syncSelectionAfterRender()
          renderTree()
          return
        }

        const groups = activeFolder
          ? currentGroups.filter((group) => group.folder === activeFolder)
          : currentGroups

        fragment.appendChild(createParentFolderCard())

        const hasQuery = fileSearchInput.value.trim().length > 0

        if (activeFolder) {
          for (const folder of getImmediateChildFolders(activeFolder)) {
            if (
              hasQuery &&
              getVisibleItems(getFolderGroupItems(folder)).length === 0
            )
              continue
            fragment.appendChild(
              createFolderCard(folder, getFolderGroupItems(folder)),
            )
          }
        } else {
          for (const folder of getImmediateChildFolders(null)) {
            if (
              hasQuery &&
              getVisibleItems(getFolderGroupItems(folder)).length === 0
            )
              continue
            fragment.appendChild(
              createFolderCard(folder, getFolderGroupItems(folder)),
            )
          }
        }

        const files = sortItemsForGrid(
          activeFolder
            ? getVisibleItems(groups[0]?.items || [])
            : getVisibleItems(
                currentGroups.find((group) => group.folder === ROOT_FOLDER)
                  ?.items || [],
              ),
        )
        const visibleFiles = files.slice(0, gridVisibleLimit)

        for (const item of visibleFiles) {
          fragment.appendChild(createFileCard(item, currentServerType))
        }

        if (files.length > visibleFiles.length) {
          fragment.appendChild(
            createLoadMoreCard(files.length - visibleFiles.length),
          )
        }

        if (!fragment.childNodes.length) {
          const empty = document.createElement('div')
          empty.className = 'preview-placeholder'
          empty.textContent = '표시할 파일이 없습니다.'
          fragment.appendChild(empty)
        }

        folderGrid.replaceChildren(fragment)
        syncSelectionAfterRender()
        renderTree()
      }

      function selectPreviewItem(item, type, cardEl = null) {
        addToSelection(item, type, cardEl)
      }

      function renderPreview(selection) {
        previewStage.innerHTML = ''
        previewStage.scrollTop = 0

        if (!selection) {
          previewTitle.textContent = '선택된 파일 없음'
          previewMeta.textContent =
            '파일을 클릭하면 미리보기와 정보가 표시됩니다.'
          previewActions.classList.add('hidden')
          updateGridToolbar()

          const placeholder = document.createElement('div')
          placeholder.className = 'preview-placeholder'
          placeholder.textContent =
            '파일을 선택하면 이 영역에 미리보기가 표시됩니다.'
          previewStage.appendChild(placeholder)
          return
        }

        const { item, type } = selection
        const url = getItemDisplayUrl(item, type)
        const uploadedText = formatUploadedDate(item.uploaded)

        previewTitle.textContent = item.displayName || item.name || 'unknown'
        previewMeta.textContent = `${item.relativePath || item.name || ''} · ${formatFileSize(item.size)}${uploadedText ? ` · ${uploadedText}` : ''}`
        previewActions.classList.remove('hidden')
        updateGridToolbar()

        if (isVideoItem(item, type)) {
          const video = document.createElement('video')
          video.src = url
          video.controls = true
          video.autoplay = true
          video.muted = true
          video.loop = true
          previewStage.appendChild(video)
          return
        }

        if (isImageItem(item, type)) {
          const img = document.createElement('img')
          img.src = url
          img.alt = item.displayName || item.name || ''
          previewStage.appendChild(img)
          return
        }

        const placeholder = document.createElement('div')
        placeholder.className = 'preview-placeholder'
        placeholder.textContent = '이 파일 형식은 미리보기를 지원하지 않습니다.'
        previewStage.appendChild(placeholder)
      }

      function renderServerFiles(items, type) {
        currentServerType = type
        activeBrowseType = type
        currentGroups = groupItemsByFolder(items, type)
        clearSelection()
        selectedPreview = null
        gridVisibleLimit = GRID_BATCH_SIZE

        const fileCount = currentGroups.reduce(
          (sum, group) => sum + group.items.length,
          0,
        )
        const folderCount = currentGroups.filter(
          (group) => group.folder !== ROOT_FOLDER,
        ).length

        if (currentGroups.length === 0) {
          setSidebarStatus(`${R2_BRAND_ROOT}/${type}에 파일이 없습니다.`)
          renderExplorerGrid()
          renderPreview(null)
          return
        }

        setSidebarStatus(`${fileCount}개 파일 · ${folderCount}개 폴더`)
        renderExplorerGrid()
        renderPreview(null)
      }

      async function refreshServerFiles(force = false) {
        const type = activeBrowseType
        if (!type) {
          renderTree()
          return
        }

        const cacheKey = `${getListWorkerBase()}::${type}`

        if (!force && serverListCache.has(cacheKey)) {
          renderServerFiles(serverListCache.get(cacheKey), type)
          return
        }

        const loadFiles = async () => {
          serverFileList.innerHTML = ''
          folderGrid.innerHTML = ''
          setSidebarStatus('서버 파일 목록을 불러오는 중...', 'loading')

          try {
            const items = await fetchServerFiles(type)
            serverListCache.set(cacheKey, items)
            renderServerFiles(items, type)
          } catch (err) {
            if (err.message === 'LIST_API_NOT_READY') {
              setSidebarStatus(
                '목록 API가 아직 준비되지 않았습니다. Worker에 GET /list?type=... 를 추가해주세요.',
                'error',
              )
            } else if (err.message.startsWith('HTTP_')) {
              setSidebarStatus(
                `목록 조회 실패 (상태코드: ${err.message.replace('HTTP_', '')})`,
                'error',
              )
            } else if (err.message === 'INVALID_RESPONSE') {
              setSidebarStatus(
                '목록 API 응답 형식이 올바르지 않습니다.',
                'error',
              )
            } else {
              setSidebarStatus(
                '목록을 불러오지 못했습니다. 네트워크 또는 CORS를 확인해주세요.',
                'error',
              )
            }
          }
        }

        if (isAppBusy()) {
          await loadFiles()
          return
        }

        await withAppBusy('서버 파일 목록을 불러오는 중...', loadFiles)
      }

      async function uploadSingleFile(
        file,
        targetPath,
        uploadButton,
        fileRow,
        forceOverwrite = false,
        options = {},
      ) {
        const {
          skipRefresh = false,
          suppressConfirm = false,
          skipBusy = false,
        } = options

        const runUpload = async () => {
          const url = buildUploadUrl(targetPath, file.name, forceOverwrite)
          uploadButton.disabled = true

          try {
            const res = await fetch(url, {
              method: 'PUT',
              headers: {
                'Content-Type': file.type || 'application/octet-stream',
              },
              body: file,
            })

            if (res.ok) {
              uploadButton.className = 'upload-button completed'
              uploadButton.innerText = '업로드 완료'

              if (!skipRefresh && isViewingUploadPath(targetPath)) {
                await refreshServerFiles(true)
              }
              updateUploadQueueStatus()
              return 'success'
            }

            if (res.status === 409 && !forceOverwrite) {
              const conflictBody = await res.text()
              const isEmbedConflict = conflictBody.includes('Embed')

              if (suppressConfirm) {
                uploadButton.disabled = false
                updateUploadQueueStatus()
                return 'failed'
              }

              let overwrite
              if (isEmbedConflict) {
                const embedKey = buildEmbedKeyForUpload(targetPath, file.name)
                overwrite = await uiConfirm(
                  `[태그(embed HTML) 중복]\n\n"${file.name}" 원본 파일명은 현재 업로드 폴더에서 중복이 아닐 수 있지만,\niframe용 HTML을 embed 폴더에 만들 때 같은 태그 파일명이 이미 있습니다.\n\n생성 예정 태그 파일:\n${embedKey}\n\n덮어쓰면 기존 iframe 태그 HTML이 교체됩니다.\n취소 후 파일명을 바꿔 다시 넣을 수 있습니다.\n\n덮어쓸까요?`,
                  { title: '태그 중복' },
                )
              } else {
                overwrite = await uiConfirm(
                  `[원본 파일 중복]\n\n업로드하려는 현재 폴더 안에 같은 파일명이 이미 있습니다.\n\n기존 파일:\n${targetPath}/${file.name}\n\n덮어쓰면 해당 폴더의 기존 파일이 교체됩니다.\n\n덮어쓸까요?`,
                  { title: '파일 중복' },
                )
              }

              if (overwrite) {
                return uploadSingleFile(
                  file,
                  targetPath,
                  uploadButton,
                  fileRow,
                  true,
                  options,
                )
              }
              uploadButton.disabled = false
              updateUploadQueueStatus()
              return 'skipped'
            }

            await uiAlert(`업로드 실패: ${file.name} (상태코드: ${res.status})`)
            uploadButton.disabled = false
            updateUploadQueueStatus()
            return 'failed'
          } catch {
            await uiAlert(`업로드 중 오류 발생: ${file.name}`)
            uploadButton.disabled = false
            updateUploadQueueStatus()
            return 'failed'
          }
        }

        if (skipBusy || isAppBusy()) {
          return runUpload()
        }

        return withAppBusy(`"${file.name}" 업로드 중...`, runUpload)
      }

      async function uploadAllPending() {
        if (isAppBusy()) return

        const jobs = getPendingUploadJobs()

        if (jobs.length === 0) {
          await uiAlert('업로드할 파일이 없습니다.')
          return
        }

        const internalDuplicates = findQueueInternalDuplicateKeys(jobs)
        if (internalDuplicates.length > 0) {
          const preview = internalDuplicates.slice(0, 10).join('\n')
          const extra =
            internalDuplicates.length > 10
              ? `\n... 외 ${internalDuplicates.length - 10}개`
              : ''
          await uiAlert(
            `[대기열 내부 중복]\n\n아직 서버와 비교하기 전 단계에서, 업로드 대기열 안에 같은 업로드 경로와 파일명이 중복되어 있습니다.\n같은 파일이 두 번 올라가지 않도록 중복 항목을 정리한 뒤 다시 시도해주세요.\n\n중복 경로:\n${preview}${extra}`,
          )
          return
        }

        const internalEmbedDuplicates =
          findQueueInternalEmbedDuplicateKeys(jobs)
        if (internalEmbedDuplicates.length > 0) {
          const preview = internalEmbedDuplicates.slice(0, 5).join('\n\n')
          const extra =
            internalEmbedDuplicates.length > 5
              ? `\n\n... 외 ${internalEmbedDuplicates.length - 5}개`
              : ''
          await uiAlert(
            `[대기열 내부 태그(embed HTML) 중복]\n\n서로 다른 업로드 경로의 비디오가 같은 embed HTML 태그 파일을 만들려고 합니다.\n이 상태로 올리면 iframe용 태그 파일이 서로 덮어써질 수 있으니, 파일명을 바꾸거나 중복 항목을 정리한 뒤 다시 시도해주세요.\n\n중복 항목:\n${preview}${extra}`,
          )
          return
        }

        const { fileDuplicates, embedDuplicates, duplicateKeys } =
          await withAppBusy('중복 검사 중...', () => findUploadConflicts(jobs))

        if (fileDuplicates.length > 0 || embedDuplicates.length > 0) {
          const overwriteAll = await confirmBatchUploadOverwrite(
            fileDuplicates,
            embedDuplicates,
          )
          if (!overwriteAll) return
        }

        await withAppBusy('업로드 중...', async () => {
          let success = 0
          let failed = 0
          let lastTargetPath = null
          const successfulRows = []

          for (let index = 0; index < jobs.length; index += 1) {
            const job = jobs[index]
            lastTargetPath = job.targetPath
            setBusyMessage(`업로드 중... (${index + 1}/${jobs.length})`)
            uploadQueueStatus.textContent = `업로드 중... (${index + 1}/${jobs.length})`

            const forceOverwrite = duplicateKeys.has(getUploadJobKey(job))
            const result = await uploadSingleFile(
              job.file,
              job.targetPath,
              job.uploadButton,
              job.row,
              forceOverwrite,
              { skipRefresh: true, suppressConfirm: true, skipBusy: true },
            )

            if (result === 'success') {
              success += 1
              successfulRows.push(job.row)
            } else {
              failed += 1
            }
          }

          for (const row of successfulRows) {
            row.remove()
          }

          if (lastTargetPath && isViewingUploadPath(lastTargetPath)) {
            await refreshServerFiles(true)
          }

          updateUploadQueueStatus()
          await uiAlert(`일괄 업로드 완료\n성공: ${success}개\n실패: ${failed}개`)
        })
      }

      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
      }

      function quoteHtml(value) {
        return `<em>"${escapeHtml(value)}"</em>`
      }

      function stripTrailingSlash(path) {
        return String(path || '').replace(/\/+$/, '')
      }

      function getPathFolder(path) {
        const slash = path.lastIndexOf('/')
        return slash === -1 ? '' : path.slice(0, slash)
      }

      function getPathBaseName(path) {
        const clean = stripTrailingSlash(path)
        const slash = clean.lastIndexOf('/')
        return slash === -1 ? clean : clean.slice(slash + 1)
      }

      function formatLogTimestamp(ts) {
        try {
          return new Date(ts)
            .toLocaleString('sv-SE', { timeZone: 'Asia/Seoul' })
            .replace('T', ' ')
        } catch {
          return ts || ''
        }
      }

      function formatLogSentenceHtml(entry) {
        switch (entry.action) {
          case 'upload':
            return `${quoteHtml(getPathFolder(entry.path))} 폴더에 ${quoteHtml(getPathBaseName(entry.path))} 파일을 추가했습니다.`
          case 'delete':
            return `${quoteHtml(getPathFolder(entry.path))} 폴더에서 ${quoteHtml(getPathBaseName(entry.path))} 파일을 삭제했습니다.`
          case 'rename':
            return `${quoteHtml(entry.from)} 파일 이름을 ${quoteHtml(entry.to)}(으)로 변경했습니다.`
          case 'mkdir':
            return `${quoteHtml(stripTrailingSlash(entry.path))} 폴더를 생성했습니다.`
          case 'rmdir':
            return `${quoteHtml(stripTrailingSlash(entry.path))} 폴더와 안의 항목 ${entry.count || 0}개를 삭제했습니다.`
          case 'mvdir':
            return `${quoteHtml(stripTrailingSlash(entry.from))} 폴더를 ${quoteHtml(stripTrailingSlash(entry.to))}(으)로 이동했습니다. (${entry.count || 0}개)`
          default:
            return escapeHtml(JSON.stringify(entry))
        }
      }

      function formatLogPlainText(entry) {
        return formatLogSentenceHtml(entry)
          .replace(/<[^>]+>/g, '')
          .replace(/&quot;/g, '"')
          .replace(/&amp;/g, '&')
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
      }

      function getCurrentMonthKey() {
        const now = new Date()
        const year = now.getUTCFullYear()
        const month = String(now.getUTCMonth() + 1).padStart(2, '0')
        return `${year}-${month}`
      }

      async function fetchLogMonths() {
        const res = await fetch(`${UPLOAD_WORKER_BASE}/logs/months`)
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        const data = await res.json()
        return Array.isArray(data.months) ? data.months : []
      }

      async function fetchLogMonth(month) {
        const res = await fetch(
          `${UPLOAD_WORKER_BASE}/logs?month=${encodeURIComponent(month)}`,
        )
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        const data = await res.json()
        return Array.isArray(data.entries) ? data.entries : []
      }

      function sortHistoryEntries() {
        historyEntries.sort((a, b) => new Date(b.ts) - new Date(a.ts))
      }

      function renderHistoryRows() {
        const query = historySearchInput.value.trim().toLowerCase()
        const filtered = historyEntries.filter((entry) => {
          if (!query) return true
          const haystack =
            `${formatLogPlainText(entry)} ${entry.path || ''} ${entry.from || ''} ${entry.to || ''}`.toLowerCase()
          return haystack.includes(query)
        })

        if (filtered.length === 0) {
          historyListEl.innerHTML =
            '<div class="history-empty">표시할 기록이 없습니다.</div>'
          return
        }

        const fragment = document.createDocumentFragment()
        for (const entry of filtered) {
          const row = document.createElement('div')
          row.className = 'history-row'

          const icon = document.createElement('span')
          icon.className = 'history-row-icon'
          icon.textContent = '▣'
          icon.setAttribute('aria-hidden', 'true')

          const text = document.createElement('span')
          text.className = 'history-row-text'
          text.innerHTML = formatLogSentenceHtml(entry)

          const time = document.createElement('time')
          time.className = 'history-row-time'
          time.dateTime = entry.ts || ''
          time.textContent = formatLogTimestamp(entry.ts)

          row.appendChild(icon)
          row.appendChild(text)
          row.appendChild(time)
          fragment.appendChild(row)
        }

        historyListEl.replaceChildren(fragment)
      }

      function updateHistoryMoreButton() {
        const noMore = historyMonthIndex >= historyMonths.length
        btnHistoryMore.disabled = historyLoading || noMore
        btnHistoryMore.textContent = noMore ? '더 이상 없음' : '더 보기'
      }

      async function loadMoreHistory() {
        if (historyLoading || historyMonthIndex >= historyMonths.length) {
          updateHistoryMoreButton()
          return
        }

        historyLoading = true
        updateHistoryMoreButton()

        const month = historyMonths[historyMonthIndex]
        historyMonthIndex += 1

        try {
          if (!historyLoadedMonths.has(month)) {
            const entries = await fetchLogMonth(month)
            historyLoadedMonths.add(month)
            historyEntries.push(...entries)
            sortHistoryEntries()
          }
          renderHistoryRows()
        } catch {
          historyListEl.innerHTML =
            '<div class="history-empty">히스토리를 불러오지 못했습니다.</div>'
        } finally {
          historyLoading = false
          updateHistoryMoreButton()
        }
      }

      async function openHistory() {
        if (isAppBusy()) return

        historyModal.classList.add('open')
        historyModal.setAttribute('aria-hidden', 'false')
        historySearchInput.value = ''
        historyEntries = []
        historyLoadedMonths = new Set()
        historyMonthIndex = 0
        historyListEl.innerHTML =
          '<div class="history-empty">불러오는 중...</div>'
        btnHistoryMore.disabled = true
        btnHistoryMore.textContent = '불러오는 중...'

        try {
          historyMonths = await fetchLogMonths()
          if (historyMonths.length === 0) {
            historyMonths = [getCurrentMonthKey()]
          }
          await loadMoreHistory()
        } catch {
          historyListEl.innerHTML =
            '<div class="history-empty">히스토리를 불러오지 못했습니다. Worker 배포 후 다시 시도해주세요.</div>'
          btnHistoryMore.disabled = true
          btnHistoryMore.textContent = '더 이상 없음'
        }
      }

      function closeHistory() {
        historyModal.classList.remove('open')
        historyModal.setAttribute('aria-hidden', 'true')
      }

      function initHistoryModal() {
        historySearchInput.addEventListener('input', () => {
          renderHistoryRows()
        })

        historyModal.addEventListener('click', (event) => {
          if (event.target === historyModal) {
            closeHistory()
          }
        })

        document.addEventListener('keydown', (event) => {
          if (
            event.key === 'Escape' &&
            historyModal.classList.contains('open')
          ) {
            closeHistory()
          }
        })
      }

      loadBrowseTypes()
      applyGridViewClass()
      syncGridViewControls()
      refreshServerFiles()
      setSidebarStatus('타입을 선택하세요.')
      updateGridToolbar()
    </script>
  </body>
</html>
