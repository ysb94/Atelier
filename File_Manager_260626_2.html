<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>파일 업로드 + 덮어쓰기 + RESET + URL 복사</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --accent: #b01818;
        --line: #ededed;
        --muted: #777;
        --soft: #f7f7f7;
        --panel: #fff;
        --text: #222;
        --preview-width: 430px;
        --tag-panel-height: 160px;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13px;
        color: var(--text);
        background: #fff;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        border: 1px solid #d8d8d8;
        background: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #f2f2f2;
      }
      .app-layout {
        display: grid;
        grid-template-columns: 210px minmax(520px, 1fr) var(--preview-width);
        height: 100vh;
        overflow: hidden;
      }
      .sidebar {
        border-right: 1px solid var(--line);
        background: #fff;
        display: flex;
        flex-direction: column;
        min-width: 0;
        height: 100vh;
        overflow: hidden;
      }
      .sidebar-brand {
        width: 100%;
        height: 56px;
        border: none;
        border-bottom: 1px solid var(--line);
        background: #fff;
        padding: 0 14px;
        text-align: left;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--accent);
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
      }
      .sidebar-brand:hover:not(:disabled) {
        background: #fafafa;
      }
      .sidebar-brand:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .sidebar-status {
        padding: 9px 14px;
        color: var(--muted);
        font-size: 12px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .sidebar-status.error {
        color: #9d1111;
        background: #fff3f3;
      }
      .sidebar-status.loading {
        color: #555;
        font-style: italic;
      }
      .search-box input,
      .upload-toolbar select,
      .upload-toolbar input[type='file'] {
        width: 100%;
        min-width: 0;
        border: 1px solid #ddd;
        padding: 7px 8px;
        background: #fff;
      }
      .toolbar-button,
      .grid-tool-btn,
      .preview-actions button,
      .upload-button {
        padding: 7px 10px;
        border-radius: 0;
        font-size: 12px;
      }
      .server-file-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px 8px 18px;
      }
      .tree-root {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .tree-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 6px;
        border: none;
        background: transparent;
        padding: 5px 6px;
        text-align: left;
        color: #333;
      }
      .tree-item:hover,
      .tree-item.active {
        background: #f1f1f1;
      }
      .tree-children {
        margin-left: 16px;
        border-left: 1px solid #eee;
        padding-left: 5px;
      }
      .tree-icon {
        width: 14px;
        color: #555;
        flex-shrink: 0;
      }
      .tree-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .main-content {
        min-width: 0;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: #fff;
      }
      .topbar {
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
      }
      .breadcrumb {
        color: #555;
        font-size: 12px;
      }
      .breadcrumb strong {
        color: #222;
      }
      .search-box {
        width: 260px;
      }
      .search-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .global-search-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #444;
        white-space: nowrap;
        user-select: none;
      }
      .global-search-toggle input {
        margin: 0;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .history-modal {
        position: fixed;
        inset: 0;
        z-index: 21000;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
        padding: 24px;
      }
      .history-modal.open {
        display: flex;
      }
      .history-panel {
        width: min(920px, 100%);
        max-height: min(86vh, 760px);
        background: #fff;
        border: 1px solid var(--line);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .history-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .history-header h2 {
        margin: 0;
        font-size: 16px;
        flex: 1;
        min-width: 80px;
      }
      .history-search {
        width: 220px;
        min-width: 140px;
        border: 1px solid #ddd;
        padding: 7px 8px;
        background: #fff;
      }
      .history-hint {
        margin: 0;
        padding: 8px 18px;
        font-size: 12px;
        color: var(--muted);
        border-bottom: 1px solid #f2f2f2;
        background: #fafafa;
      }
      .history-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 8px 0;
      }
      .history-row {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        padding: 10px 18px;
        border-bottom: 1px solid #f3f3f3;
        font-size: 13px;
        line-height: 1.45;
      }
      .history-row:hover {
        background: #fafafa;
      }
      .history-row-icon {
        color: #4a90d9;
        flex-shrink: 0;
        width: 18px;
        text-align: center;
        margin-top: 1px;
      }
      .history-row-text {
        flex: 1;
        min-width: 0;
        word-break: break-all;
      }
      .history-row-text em {
        font-style: normal;
        color: #2a6ea8;
      }
      .history-row-time {
        flex-shrink: 0;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .history-empty {
        padding: 32px 18px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .history-footer {
        padding: 12px 18px;
        border-top: 1px solid var(--line);
        text-align: center;
        background: #fafafa;
      }
      .workspace-area {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }
      .workspace-area.drop-active {
        outline: 2px dashed #6baee8;
        outline-offset: -4px;
        background: #f7fbff;
      }
      .workspace-area.drop-active::after {
        content: '여기에 파일을 놓으면 업로드 대기열에 추가됩니다';
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(247, 251, 255, 0.92);
        color: #2a6ea8;
        font-size: 14px;
        font-weight: bold;
        pointer-events: none;
        z-index: 20;
      }
      .upload-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .upload-hint {
        color: var(--muted);
        font-size: 12px;
      }
      .grid-toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 18px;
        border-bottom: 1px solid var(--line);
        background: #fafafa;
        flex-wrap: wrap;
      }
      .grid-tool-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px;
        border: 1px solid #ccc;
        background: #fff;
        color: #333;
        font-size: 12px;
        line-height: 1.2;
      }
      .grid-tool-btn:hover:not(:disabled) {
        background: #f3f3f3;
      }
      .grid-tool-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .grid-tool-btn.danger {
        color: #b01818;
        border-color: #d4a0a0;
        background: #fff5f5;
      }
      .grid-tool-btn.danger:hover:not(:disabled) {
        background: #ffe8e8;
        border-color: #c06060;
      }
      .grid-tool-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .grid-tool-btn.active:hover:not(:disabled) {
        background: var(--accent);
      }
      .grid-toolbar-spacer {
        flex: 1;
        min-width: 8px;
      }
      .grid-tool-select {
        padding: 5px 8px;
        border: 1px solid #ccc;
        background: #fff;
        font-size: 12px;
        color: #333;
      }
      .upload-toolbar select,
      .upload-toolbar input[type='file'] {
        border: 1px solid #ddd;
        padding: 7px 8px;
        background: #fff;
      }
      .upload-button.completed {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .upload-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .folder-grid {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 18px 20px 24px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        align-content: start;
        gap: 18px 22px;
      }
      .grid-card {
        border: none;
        background: transparent;
        padding: 0;
        min-width: 0;
        width: 100%;
        max-width: 110px;
        text-align: center;
        cursor: pointer;
        justify-self: center;
      }
      .folder-grid.view-large {
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      }
      .folder-grid.view-large .grid-card {
        max-width: 190px;
      }
      .folder-grid.view-list {
        display: block;
        padding: 8px 16px 24px;
      }
      .folder-grid.view-list .grid-card {
        max-width: none;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        padding: 7px 8px;
        border-bottom: 1px solid #eee;
        justify-self: stretch;
      }
      .folder-grid.view-list .grid-thumb {
        display: none;
      }
      .folder-grid.view-list .grid-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        min-width: 0;
      }
      .grid-list-type-icon {
        flex-shrink: 0;
        width: 26px;
        text-align: center;
        font-size: 16px;
        line-height: 1;
      }
      .grid-card:hover .grid-thumb {
        border-color: #b8d4f0;
        background: #f7fbff;
      }
      .grid-card.active .grid-thumb {
        border-color: #6baee8;
        background: #e3f1fc;
        box-shadow: inset 0 0 0 1px #6baee8;
      }
      .grid-card.selected .grid-thumb {
        border-color: #4a90d9;
        background: #eef6fd;
        box-shadow: inset 0 0 0 2px #4a90d9;
      }
      .grid-card.marquee-candidate .grid-thumb {
        border-color: #9ecbf0;
        background: #f0f8ff;
      }
      .marquee-select {
        position: fixed;
        border: 1px solid #4a90d9;
        background: rgba(74, 144, 217, 0.12);
        pointer-events: none;
        z-index: 9999;
      }
      .load-more-card {
        border: 1px dashed #ccc;
        color: #555;
        min-height: 100px;
        max-width: 110px;
        padding: 10px 6px;
        background: #fff;
      }
      .load-more-card strong {
        display: block;
        margin-bottom: 6px;
        color: #222;
        font-size: 12px;
      }
      .grid-thumb {
        width: 100%;
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        border: 1px solid #d5d5d5;
        overflow: hidden;
      }
      .grid-thumb img,
      .grid-thumb video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        padding: 4px;
        -webkit-user-drag: none;
        user-select: none;
      }
      .grid-thumb.video-thumb {
        position: relative;
        background: #f7f7f7;
      }
      .grid-thumb.video-thumb.loading-video::after {
        content: '▶';
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #aaa;
        font-size: 22px;
        pointer-events: none;
      }
      .grid-icon-folder {
        width: 46px;
        height: 38px;
        background: linear-gradient(180deg, #ffd54f 0%, #f4b400 100%);
        border-radius: 3px 6px 4px 4px;
        position: relative;
        box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.08);
      }
      .grid-icon-folder::before {
        content: '';
        position: absolute;
        top: -7px;
        left: 0;
        width: 20px;
        height: 8px;
        background: #ffdf6b;
        border-radius: 3px 3px 0 0;
      }
      .grid-icon-parent {
        font-size: 28px;
        color: #666;
        line-height: 1;
      }
      .grid-icon-file {
        font-size: 28px;
        color: #888;
        line-height: 1;
      }
      .grid-name {
        margin-top: 7px;
        overflow: hidden;
        color: #333;
        font-size: 11px;
        line-height: 1.35;
        word-break: break-all;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .grid-name-wrap .grid-name {
        margin-top: 0;
      }
      .grid-path {
        margin-top: 4px;
        overflow: hidden;
        color: #888;
        font-size: 10px;
        line-height: 1.35;
        word-break: break-all;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .upload-queue {
        padding: 0 18px 10px;
        max-height: 150px;
        overflow-y: auto;
      }
      .upload-queue-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 18px;
        border-top: 1px solid var(--line);
        background: #fafafa;
      }
      .url-output .upload-queue-header {
        padding: 8px 0;
        border-top: none;
        border-bottom: 1px solid var(--line);
        background: transparent;
        margin-bottom: 6px;
      }
      .upload-queue-status {
        font-size: 12px;
        color: var(--muted);
      }
      .upload-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .upload-row span {
        min-width: 160px;
      }
      .url-output {
        padding: 0 18px 18px;
        border-top: 1px solid var(--line);
        flex-shrink: 0;
        height: var(--tag-panel-height);
        min-height: 80px;
        max-height: min(480px, 60vh);
        display: flex;
        flex-direction: column;
      }
      .tag-panel-resizer {
        height: 8px;
        margin: 0 -18px 8px;
        cursor: row-resize;
        background: transparent;
        border-top: 1px solid var(--line);
        touch-action: none;
        flex-shrink: 0;
      }
      .tag-panel-resizer:hover,
      .tag-panel-resizer.dragging {
        background: #e8e8e8;
      }
      .tag-list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
        flex-shrink: 0;
      }
      .tag-list-header-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .tag-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        border: 1px solid #ddd;
        background: #fafafa;
      }
      .tag-list-empty {
        padding: 14px 12px;
        color: var(--muted);
        font-size: 12px;
      }
      .tag-row {
        display: flex;
        align-items: stretch;
        gap: 0;
        border-bottom: 1px solid #ececec;
        background: #fff;
      }
      .tag-row:last-child {
        border-bottom: none;
      }
      .tag-row.active {
        background: #eef6fd;
      }
      .tag-row.drag-over {
        border-top: 2px solid #4a90d9;
      }
      .tag-drag-handle {
        flex-shrink: 0;
        width: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #999;
        cursor: grab;
        user-select: none;
        border-right: 1px solid #ececec;
        background: #f7f7f7;
      }
      .tag-drag-handle:active {
        cursor: grabbing;
      }
      .tag-body {
        flex: 1;
        min-width: 0;
        border: none;
        background: transparent;
        text-align: left;
        padding: 8px 10px;
        font-family: Consolas, monospace;
        font-size: 11px;
        color: #333;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tag-body:hover {
        background: #f3f8fd;
      }
      .tag-delete {
        flex-shrink: 0;
        width: 32px;
        border: none;
        border-left: 1px solid #ececec;
        background: #fff;
        color: #b01818;
        font-size: 16px;
        line-height: 1;
      }
      .tag-delete:hover {
        background: #fff3f3;
      }
      .preview-shell {
        display: flex;
        height: 100vh;
        min-width: 0;
        overflow: hidden;
      }
      .preview-resizer {
        width: 6px;
        flex-shrink: 0;
        cursor: col-resize;
        background: transparent;
        border-left: 1px solid var(--line);
        touch-action: none;
      }
      .preview-resizer:hover,
      .preview-resizer.dragging {
        background: #e8e8e8;
      }
      .preview-panel {
        flex: 1;
        min-width: 0;
        background: #fff;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      .preview-top {
        flex-shrink: 0;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .preview-top button {
        min-width: 38px;
        height: 32px;
        background: #111;
        color: #fff;
        border: none;
      }
      .preview-stage {
        flex: 1;
        min-height: 0;
        padding: 12px;
        background: #fff;
        overflow: auto;
        overscroll-behavior: contain;
      }
      .preview-stage img,
      .preview-stage video {
        display: block;
        max-width: 100%;
        width: auto;
        height: auto;
        margin: 0 auto;
        object-fit: contain;
      }
      .preview-placeholder {
        max-width: 250px;
        color: var(--muted);
        text-align: center;
        line-height: 1.6;
      }
      .preview-info {
        flex-shrink: 0;
        padding: 16px;
        border-top: 1px solid var(--line);
        max-height: 180px;
        overflow-y: auto;
      }
      .preview-info h2 {
        margin: 0 0 8px;
        font-size: 16px;
        line-height: 1.35;
        word-break: break-all;
      }
      .preview-info p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .preview-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .hidden {
        display: none;
      }
      .ctx-menu {
        position: fixed;
        z-index: 10000;
        min-width: 160px;
        background: #fff;
        border: 1px solid #ccc;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        padding: 4px 0;
        display: none;
      }
      .ctx-menu.open {
        display: block;
      }
      .ctx-menu-item {
        width: 100%;
        border: none;
        background: transparent;
        text-align: left;
        padding: 8px 14px;
        font-size: 12px;
        color: #222;
      }
      .ctx-menu-item:hover {
        background: #f2f2f2;
      }
      .ctx-menu-item.danger {
        color: #b01818;
      }
      .ctx-menu-separator {
        height: 1px;
        background: #ececec;
        margin: 4px 0;
      }
      body.app-busy {
        overflow: hidden;
      }
      .app-loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 20000;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.74);
        backdrop-filter: blur(1px);
        pointer-events: all;
      }
      .app-loading-overlay.open {
        display: flex;
      }
      .app-loading-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px 28px;
        background: #fff;
        border: 1px solid var(--line);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        min-width: 220px;
        max-width: min(90vw, 360px);
      }
      .app-loading-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e8e8e8;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
        flex-shrink: 0;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .app-loading-message {
        font-size: 13px;
        color: #444;
        text-align: center;
        line-height: 1.45;
        word-break: keep-all;
      }
      .ui-dialog-overlay {
        position: fixed;
        inset: 0;
        z-index: 22000;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
        padding: 24px;
      }
      .ui-dialog-overlay.open {
        display: flex;
      }
      .ui-dialog-panel {
        width: min(480px, 100%);
        max-height: min(86vh, 560px);
        background: #fff;
        border: 1px solid var(--line);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .ui-dialog-title {
        margin: 0;
        padding: 16px 18px 0;
        font-size: 15px;
        font-weight: 600;
        color: #222;
      }
      .ui-dialog-message {
        margin: 0;
        padding: 12px 18px 0;
        font-size: 13px;
        color: #444;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: keep-all;
        overflow-y: auto;
        max-height: min(50vh, 360px);
      }
      .ui-dialog-input {
        margin: 12px 18px 0;
        width: calc(100% - 36px);
        border: 1px solid #ddd;
        padding: 8px 10px;
        font-size: 13px;
        background: #fff;
      }
      .ui-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 16px 18px 18px;
        margin-top: auto;
      }
      .ui-dialog-btn {
        padding: 7px 14px;
        border: 1px solid #ccc;
        background: #fff;
        font-size: 12px;
        color: #222;
        cursor: pointer;
      }
      .ui-dialog-btn:hover {
        background: #f2f2f2;
      }
      .ui-dialog-btn.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }
      .ui-dialog-btn.primary:hover {

      }
      .ui-dialog-btn.danger {

        background: #b01818;

      }
      .ui-dialog-btn.danger:hover {

      @media (max-width: 1100px) {
        .app-layout {
          grid-template-columns: 190px minmax(420px, 1fr);
        }
        .preview-shell {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-layout">

    <script>
      const UPLOAD_WORKER_BASE =
        'https://r2-worker.masmarulez-upload.workers.dev'
      const DEFAULT_LIST_WORKER_BASE =
        'https://r2-worker.masmarulez-upload.workers.dev'
      const LIST_WORKER_STORAGE_KEY = 'masmarulezListWorkerBase'
      const CDN_BASE = 'https://cdn2.auchee.com'
      const ROOT_FOLDER = '루트 파일'
      const R2_BRAND_ROOT = 'masmarulez'
      const DEFAULT_BROWSE_TYPES = ['embed', 'image', 'spin360', 'video']
      const HIDDEN_BROWSE_TYPES = new Set(['logs'])
      let BROWSE_TYPES = [...DEFAULT_BROWSE_TYPES]
      const GRID_BATCH_SIZE = 60
      const MARQUEE_THRESHOLD = 5
      const PREVIEW_WIDTH_KEY = 'masmarulezPreviewWidth'
      const PREVIEW_MIN_WIDTH = 280
      const PREVIEW_MAX_WIDTH = 900
      const TAG_PANEL_HEIGHT_KEY = 'masmarulezTagPanelHeight'
      const TAG_PANEL_MIN_HEIGHT = 80
      const TAG_PANEL_MAX_HEIGHT = 480
      const GRID_SORT_KEY = 'masmarulezGridSort'
      const GRID_VIEW_KEY = 'masmarulezGridView'
      const GLOBAL_SEARCH_KEY = 'masmarulezGlobalSearch'

      const sidebarStatus = document.getElementById('sidebarStatus')
      const sidebarBrand = document.getElementById('sidebarBrand')
      const serverFileList = document.getElementById('serverFileList')
      const appLoadingOverlay = document.getElementById('appLoadingOverlay')
      const appLoadingMessage = document.getElementById('appLoadingMessage')
      const historyModal = document.getElementById('historyModal')
      const historyListEl = document.getElementById('historyList')
      const historySearchInput = document.getElementById('historySearch')
      const btnHistory = document.getElementById('btnHistory')
      const btnHistoryMore = document.getElementById('btnHistoryMore')
      const folderGrid = document.getElementById('folderGrid')
      const breadcrumb = document.getElementById('breadcrumb')
      const fileSearchInput = document.getElementById('fileSearch')
      const globalSearchToggle = document.getElementById('globalSearchToggle')
      const previewStage = document.getElementById('previewStage')
      const previewTitle = document.getElementById('previewTitle')
      const previewMeta = document.getElementById('previewMeta')
      const previewActions = document.getElementById('previewActions')
      const previewResizer = document.getElementById('previewResizer')
      const btnOpenFile = document.getElementById('btnOpenFile')
      const btnAddTags = document.getElementById('btnAddTags')
      const btnDeleteSelected = document.getElementById('btnDeleteSelected')
      const btnNewFolder = document.getElementById('btnNewFolder')
      const btnSelectAll = document.getElementById('btnSelectAll')
      const gridSortSelect = document.getElementById('gridSortSelect')
      const btnViewNormal = document.getElementById('btnViewNormal')
      const btnViewLarge = document.getElementById('btnViewLarge')
      const btnViewList = document.getElementById('btnViewList')
      const tagListEl = document.getElementById('tagList')
      const tagPanelResizer = document.getElementById('tagPanelResizer')
      const workspaceArea = document.querySelector('.workspace-area')
      const fileListDiv = document.getElementById('fileList')
      const btnUploadAll = document.getElementById('btnUploadAll')
      const uploadQueueStatus = document.getElementById('uploadQueueStatus')
      const ctxMenuEl = document.getElementById('ctxMenu')
      const uiDialogOverlay = document.getElementById('uiDialogOverlay')
      const uiDialogTitle = document.getElementById('uiDialogTitle')
      const uiDialogMessage = document.getElementById('uiDialogMessage')
      const uiDialogInput = document.getElementById('uiDialogInput')
      const uiDialogOk = document.getElementById('uiDialogOk')
      const uiDialogCancel = document.getElementById('uiDialogCancel')

      let currentServerType = null
      let activeBrowseType = null
      let currentGroups = []
      let activeFolder = null
      let selectedPreview = null
      let selectedItems = new Map()
      let accumulatedTags = []
      let activeTagUid = null
      let tagUidCounter = 0
      let lastSelectedKey = null
      let gridVisibleLimit = GRID_BATCH_SIZE
      let gridSortMode = localStorage.getItem(GRID_SORT_KEY) || 'name'
      let gridViewMode = localStorage.getItem(GRID_VIEW_KEY) || 'normal'
      let searchRenderTimer = null
      let globalSearchEnabled =
        localStorage.getItem(GLOBAL_SEARCH_KEY) === 'true'
      let globalSearchRequestId = 0
      let activeCardEl = null
      let currentPreviewWidth = PREVIEW_MAX_WIDTH
      let currentTagPanelHeight = 160
      let suppressExternalDrop = false
      const serverListCache = new Map()
      let busyCount = 0
      let busyMessage = '작업 처리 중...'
      let historyMonths = []
      let historyLoadedMonths = new Set()
      let historyEntries = []
      let historyMonthIndex = 0
      let historyLoading = false
      let videoThumbObserver = null

      function isAppBusy() {
        return busyCount > 0
      }

      function setBusyMessage(message) {
        busyMessage = message
        if (busyCount > 0 && appLoadingMessage) {
          appLoadingMessage.textContent = message
        }
      }

      function updateBusyUi() {
        const busy = busyCount > 0
        document.body.classList.toggle('app-busy', busy)
        appLoadingOverlay.classList.toggle('open', busy)
        appLoadingOverlay.setAttribute('aria-hidden', busy ? 'false' : 'true')
        appLoadingOverlay.setAttribute('aria-busy', busy ? 'true' : 'false')
        if (busy && appLoadingMessage) {
          appLoadingMessage.textContent = busyMessage
        }
        if (busy) hideContextMenu()
        if (sidebarBrand) sidebarBrand.disabled = busy
        if (btnHistory) btnHistory.disabled = busy
        if (fileSearchInput) fileSearchInput.disabled = busy
        if (globalSearchToggle) globalSearchToggle.disabled = busy
        updateGridToolbar()
        updateUploadQueueStatus()
      }

      function setAppBusy(message) {
        const wasIdle = busyCount === 0
        busyCount += 1
        if (message && wasIdle) busyMessage = message
        updateBusyUi()
      }

      function clearAppBusy() {
        busyCount = Math.max(0, busyCount - 1)
        if (busyCount === 0) busyMessage = '작업 처리 중...'
        updateBusyUi()
      }

      async function withAppBusy(message, task) {
        setAppBusy(message)
        try {
          return await task()
        } finally {
          clearAppBusy()
        }
      }

      let uiDialogQueue = []
      let uiDialogResolve = null
      let currentUiDialogConfig = null

      function openNextUiDialog() {
        if (uiDialogQueue.length === 0) return

        const { config, resolve } = uiDialogQueue[0]
        currentUiDialogConfig = config
        uiDialogResolve = resolve

        uiDialogTitle.textContent = config.title || '알림'
        uiDialogMessage.textContent = config.message || ''
        uiDialogOk.textContent = config.okText || '확인'
        uiDialogCancel.textContent = config.cancelText || '취소'

        uiDialogOk.className = config.danger
          ? 'ui-dialog-btn danger'
          : 'ui-dialog-btn primary'

        if (config.mode === 'prompt') {
          uiDialogInput.classList.remove('hidden')
          uiDialogInput.value = config.defaultValue || ''
        } else {
          uiDialogInput.classList.add('hidden')
          uiDialogInput.value = ''
        }

        if (config.mode === 'alert') {
          uiDialogCancel.classList.add('hidden')
        } else {
          uiDialogCancel.classList.remove('hidden')
        }

        uiDialogOverlay.classList.add('open')
        uiDialogOverlay.setAttribute('aria-hidden', 'false')
        hideContextMenu()

        requestAnimationFrame(() => {
          if (config.mode === 'prompt') {
            uiDialogInput.focus()
            uiDialogInput.select()
          } else {
            uiDialogOk.focus()
          }
        })
      }

      function closeUiDialog(result) {
        uiDialogOverlay.classList.remove('open')
        uiDialogOverlay.setAttribute('aria-hidden', 'true')

        const resolve = uiDialogResolve
        uiDialogResolve = null
        currentUiDialogConfig = null
        uiDialogQueue.shift()

        if (resolve) resolve(result)
        if (uiDialogQueue.length > 0) {
          openNextUiDialog()
        }
      }

      function showUiDialog(config) {
        return new Promise((resolve) => {
          uiDialogQueue.push({ config, resolve })
          if (uiDialogQueue.length === 1) {
            openNextUiDialog()
          }
        })
      }

      function uiAlert(message, { title = '알림', okText = '확인' } = {}) {
        return showUiDialog({ mode: 'alert', message, title, okText })
      }

      function uiConfirm(
        message,
        {
          title = '확인',
          okText = '확인',
          cancelText = '취소',
          danger = false,
        } = {},
      ) {
        return showUiDialog({
          mode: 'confirm',
          message,
          title,
          okText,
          cancelText,
          danger,
        }).then((value) => !!value)
      }

      function uiPrompt(
        message,
        defaultValue = '',
        { title = '입력', okText = '확인', cancelText = '취소' } = {},
      ) {
        return showUiDialog({
          mode: 'prompt',
          message,
          title,
          okText,
          cancelText,
          defaultValue,
        })
      }

      function initUiDialog() {
        uiDialogOk.addEventListener('click', () => {
          if (!currentUiDialogConfig) return

          if (currentUiDialogConfig.mode === 'prompt') {
            closeUiDialog(uiDialogInput.value)
            return
          }

          if (currentUiDialogConfig.mode === 'confirm') {
            closeUiDialog(true)
            return
          }

          closeUiDialog(undefined)
        })

        uiDialogCancel.addEventListener('click', () => {
          if (!currentUiDialogConfig) return

          if (currentUiDialogConfig.mode === 'prompt') {
            closeUiDialog(null)
            return
          }

          closeUiDialog(false)
        })

        uiDialogOverlay.addEventListener('click', (event) => {
          if (event.target !== uiDialogOverlay || !currentUiDialogConfig) return

          if (currentUiDialogConfig.mode === 'alert') {
            closeUiDialog(undefined)
            return
          }

          if (currentUiDialogConfig.mode === 'prompt') {
            closeUiDialog(null)
            return
          }

          closeUiDialog(false)
        })

        uiDialogOverlay
          .querySelector('.ui-dialog-panel')
          .addEventListener('click', (event) => {
            event.stopPropagation()
          })

        uiDialogInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault()
            uiDialogOk.click()
          }
        })

        document.addEventListener('keydown', (event) => {
          if (!currentUiDialogConfig) return

          if (event.key === 'Escape') {
            event.preventDefault()
            if (currentUiDialogConfig.mode === 'alert') {
              closeUiDialog(undefined)
            } else {
              uiDialogCancel.click()
            }
            return
          }

          if (event.key === 'Enter' && currentUiDialogConfig.mode !== 'prompt') {
            event.preventDefault()
            uiDialogOk.click()
          }
        })
      }

      initPreviewResizer()
      initTagPanelResizer()
      initExternalDropZone()
      initInternalDragGuard()
      initMarqueeSelection()
      initContextMenu()
      initUiDialog()
      initGridContextMenu()
      initHistoryModal()
      renderTagList()

      function setPreviewWidth(width, persist = false) {
        currentPreviewWidth = Math.min(
          PREVIEW_MAX_WIDTH,
          Math.max(PREVIEW_MIN_WIDTH, width),
        )
        document.documentElement.style.setProperty(
          '--preview-width',
          `${currentPreviewWidth}px`,
        )
        if (persist) {
          localStorage.setItem(PREVIEW_WIDTH_KEY, String(currentPreviewWidth))
        }
      }

      function initPreviewResizer() {
        const savedWidth = Number(localStorage.getItem(PREVIEW_WIDTH_KEY))
        if (!Number.isNaN(savedWidth) && savedWidth > 0) {
          setPreviewWidth(savedWidth)
        }

        let resizing = false
        let rafId = null
        let pendingX = 0

        const applyPending = () => {
          rafId = null
          setPreviewWidth(window.innerWidth - pendingX)
        }

        const stopResize = () => {
          if (!resizing) return
          resizing = false
          if (rafId) {
            cancelAnimationFrame(rafId)
            rafId = null
          }
          previewResizer.classList.remove('dragging')
          document.body.style.cursor = ''
          document.body.style.userSelect = ''
          localStorage.setItem(PREVIEW_WIDTH_KEY, String(currentPreviewWidth))
        }

        previewResizer.addEventListener('mousedown', (event) => {
          resizing = true
          previewResizer.classList.add('dragging')
          document.body.style.cursor = 'col-resize'
          document.body.style.userSelect = 'none'
          event.preventDefault()
        })

        document.addEventListener('mousemove', (event) => {
          if (!resizing) return
          pendingX = event.clientX
          if (!rafId) {
            rafId = requestAnimationFrame(applyPending)
          }
        })

        document.addEventListener('mouseup', stopResize)
        window.addEventListener('blur', stopResize)
      }

      function setTagPanelHeight(height, persist = false) {
        const maxHeight = Math.min(
          TAG_PANEL_MAX_HEIGHT,
          Math.floor(window.innerHeight * 0.6),
        )
        currentTagPanelHeight = Math.min(
          maxHeight,
          Math.max(TAG_PANEL_MIN_HEIGHT, height),
        )
        document.documentElement.style.setProperty(
          '--tag-panel-height',
          `${currentTagPanelHeight}px`,
        )
        if (persist) {
          localStorage.setItem(
            TAG_PANEL_HEIGHT_KEY,
            String(currentTagPanelHeight),
          )
        }
      }

      function initTagPanelResizer() {
        const savedHeight = Number(localStorage.getItem(TAG_PANEL_HEIGHT_KEY))
        if (!Number.isNaN(savedHeight) && savedHeight > 0) {
          setTagPanelHeight(savedHeight)
        }

        let resizing = false
        let startY = 0
        let startHeight = 0

        const stopResize = () => {
          if (!resizing) return
          resizing = false
          tagPanelResizer.classList.remove('dragging')
          document.body.style.cursor = ''
          document.body.style.userSelect = ''
          localStorage.setItem(
            TAG_PANEL_HEIGHT_KEY,
            String(currentTagPanelHeight),
          )
        }

        tagPanelResizer.addEventListener('mousedown', (event) => {
          resizing = true
          startY = event.clientY
          startHeight = currentTagPanelHeight
          tagPanelResizer.classList.add('dragging')
          document.body.style.cursor = 'row-resize'
          document.body.style.userSelect = 'none'
          event.preventDefault()
        })

        document.addEventListener('mousemove', (event) => {
          if (!resizing) return
          const delta = startY - event.clientY
          setTagPanelHeight(startHeight + delta)
        })

        document.addEventListener('mouseup', stopResize)
        window.addEventListener('blur', stopResize)
      }

      fileSearchInput.addEventListener('input', () => {
        clearTimeout(searchRenderTimer)
        searchRenderTimer = setTimeout(() => {
          gridVisibleLimit = GRID_BATCH_SIZE
          renderExplorerGrid()
        }, 150)
      })

      if (globalSearchToggle) {
        globalSearchToggle.checked = globalSearchEnabled
        globalSearchToggle.addEventListener('change', () => {
          globalSearchEnabled = globalSearchToggle.checked
          localStorage.setItem(
            GLOBAL_SEARCH_KEY,
            globalSearchEnabled ? 'true' : 'false',
          )
          gridVisibleLimit = GRID_BATCH_SIZE
          renderExplorerGrid()
        })
      }

      function getSearchQuery() {
        return fileSearchInput.value.trim()
      }

      function isGlobalSearchActive() {
        return globalSearchEnabled && getSearchQuery().length > 0
      }

      async function ensureBrowseTypesForSearch() {
        try {
          const folders = await fetchTopLevelFolders()
          const merged = [...DEFAULT_BROWSE_TYPES]
          for (const folder of folders) {
            if (
              folder &&
              !HIDDEN_BROWSE_TYPES.has(folder) &&
              !merged.includes(folder)
            ) {
              merged.push(folder)
            }
          }
          BROWSE_TYPES = merged
        } catch {
          BROWSE_TYPES = [...DEFAULT_BROWSE_TYPES]
        }
      }

      async function ensureTypeItemsCached(type) {
        const cacheKey = `${getListWorkerBase()}::${type}`
        if (serverListCache.has(cacheKey)) {
          return serverListCache.get(cacheKey)
        }

        const items = await fetchServerFiles(type)
        serverListCache.set(cacheKey, items)
        return items
      }

      async function collectGlobalSearchMatches(query) {
        await ensureBrowseTypesForSearch()

        const normalizedQuery = query.trim().toLowerCase()
        const matches = []

        await Promise.all(
          BROWSE_TYPES.map(async (type) => {
            try {
              const items = await ensureTypeItemsCached(type)
              const groups = groupItemsByFolder(items, type)

              for (const group of groups) {
                for (const item of group.items) {
                  const locationLabel = `${type}/${item.relativePath || item.name || ''}`
                  const target =
                    `${locationLabel} ${item.displayName || ''} ${item.name || ''}`.toLowerCase()

                  if (target.includes(normalizedQuery)) {
                    matches.push({ item, type, locationLabel })
                  }
                }
              }
            } catch {
              // 일부 타입 목록 조회 실패 시 나머지 타입은 계속 검색
            }
          }),
        )

        return matches
      }

      function sortGlobalSearchMatches(matches) {
        const list = [...matches]

        switch (gridSortMode) {
          case 'name-desc':
            return list.sort((a, b) =>
              (b.item.displayName || '').localeCompare(
                a.item.displayName || '',
                'ko',
              ),
            )
          case 'date':
            return list.sort(
              (a, b) =>
                new Date(b.item.uploaded || 0) - new Date(a.item.uploaded || 0),
            )
          case 'date-desc':
            return list.sort(
              (a, b) =>
                new Date(a.item.uploaded || 0) - new Date(b.item.uploaded || 0),
            )
          case 'name':
          default:
            return list.sort((a, b) =>
              (a.item.displayName || '').localeCompare(
                a.item.displayName || '',
                'ko',
              ),
            )
        }
      }

      async function renderGlobalSearchResults() {
        const requestId = ++globalSearchRequestId
        const query = getSearchQuery()

        breadcrumb.innerHTML = `${R2_BRAND_ROOT} / <strong>전체 검색</strong> / <strong>${escapeHtml(query)}</strong>`
        activeCardEl = null
        disconnectVideoThumbObserver()

        folderGrid.replaceChildren()
        const loading = document.createElement('div')
        loading.className = 'preview-placeholder'
        loading.textContent = '전체 검색 중...'
        folderGrid.appendChild(loading)

        try {
          const matches = await collectGlobalSearchMatches(query)
          if (requestId !== globalSearchRequestId) return

          const sorted = sortGlobalSearchMatches(matches)
          const visibleMatches = sorted.slice(0, gridVisibleLimit)
          const fragment = document.createDocumentFragment()

          for (const entry of visibleMatches) {
            fragment.appendChild(
              createFileCard(entry.item, entry.type, {
                locationLabel: entry.locationLabel,
              }),
            )
          }

          if (sorted.length > visibleMatches.length) {
            fragment.appendChild(
              createLoadMoreCard(sorted.length - visibleMatches.length),
            )
          }

          if (sorted.length === 0) {
            const empty = document.createElement('div')
            empty.className = 'preview-placeholder'
            empty.textContent = `"${query}"에 해당하는 파일이 없습니다.`
            fragment.appendChild(empty)
          }

          folderGrid.replaceChildren(fragment)
          syncSelectionAfterRender()
          setSidebarStatus(`전체 검색 결과 ${sorted.length}개`)
        } catch {
          if (requestId !== globalSearchRequestId) return

          folderGrid.replaceChildren()
          const error = document.createElement('div')
          error.className = 'preview-placeholder'
          error.textContent = '전체 검색 중 오류가 발생했습니다.'
          folderGrid.appendChild(error)
        }

        renderTree()
      }

      function getItemKey(item, type) {
        return item.key || `${type}/${item.relativePath || item.name || ''}`
      }

      function getFolderSelectionKey(folder, type) {
        return `folder::${type}::${folder}`
      }

      function parseFolderSelectionKey(key) {
        if (!key.startsWith('folder::')) return null
        const body = key.slice(8)
        const splitAt = body.indexOf('::')
        if (splitAt === -1) return null
        return {
          type: body.slice(0, splitAt),
          folder: body.slice(splitAt + 2),
        }
      }

      function getBrowseTypeSelectionKey(browseType) {
        return `browse::${browseType}`
      }

      function getImmediateChildFolders(parentFolder) {
        const children = new Set()

        for (const group of currentGroups) {
          if (group.folder === ROOT_FOLDER) continue

          if (!parentFolder) {
            const slashIndex = group.folder.indexOf('/')
            children.add(
              slashIndex === -1
                ? group.folder
                : group.folder.slice(0, slashIndex),
            )
            continue
          }

          if (group.folder === parentFolder) continue

          const prefix = `${parentFolder}/`
          if (!group.folder.startsWith(prefix)) continue

          const remainder = group.folder.slice(prefix.length)
          if (!remainder) continue
          const childName = remainder.split('/')[0]
          children.add(`${parentFolder}/${childName}`)
        }

        return [...children].sort((a, b) => a.localeCompare(b, 'ko'))
      }

      function getFolderGroupItems(folder) {
        const group = currentGroups.find((entry) => entry.folder === folder)
        return group?.items || []
      }

      function getSelectableCards() {
        return [
          ...document.querySelectorAll('.file-card, .folder-card.selectable'),
        ]
      }

      function getCurrentUploadPath() {
        if (activeBrowseType) {
          return activeFolder
            ? `${activeBrowseType}/${activeFolder}`
            : activeBrowseType
        }
        return null
      }

      function isViewingUploadPath(targetPath) {
        return getCurrentUploadPath() === targetPath
      }

      function sanitizeNameInput(value) {
        return String(value || '')
          .trim()
          .replace(/[/\\]/g, '')
      }

      function buildFolderPrefix(type, folder) {
        if (folder === ROOT_FOLDER) return `${type}/`
        return `${type}/${folder}/`
      }

      function invalidateListCache(type = activeBrowseType) {
        if (!type) return
        serverListCache.delete(`${getListWorkerBase()}::${type}`)
      }

      async function refreshAfterCrud(options = {}) {
        const { reloadBrowseTypes = false, keepFolder = activeFolder } = options

        invalidateListCache(activeBrowseType)
        clearSelection()
        selectedPreview = null

        if (reloadBrowseTypes) {
          await loadBrowseTypes()
        }

        if (activeBrowseType) {
          await refreshServerFiles(true)
          if (keepFolder) {
            activeFolder = keepFolder
            renderExplorerGrid()
          }
        } else {
          renderExplorerGrid()
        }
      }

      async function apiRequest(path, options = {}) {
        const res = await fetch(`${UPLOAD_WORKER_BASE}${path}`, {
          headers: { 'Content-Type': 'application/json' },
          ...options,
        })

        let data = null
        try {
          data = await res.json()
        } catch {}

        if (!res.ok) {
          const message = data?.error || `HTTP ${res.status}`
          throw new Error(message)
        }

        return data
      }

      async function apiDelete(key) {
        const encodedKey = String(key)
          .split('/')
          .map(encodeURIComponent)
          .join('/')
        return apiRequest(`/${encodedKey}`, { method: 'DELETE' })
      }

      async function apiMove(from, to) {
        return apiRequest('/move', {
          method: 'POST',
          body: JSON.stringify({ from, to }),
        })
      }

      async function apiMkdir(path) {
        return apiRequest('/mkdir', {
          method: 'POST',
          body: JSON.stringify({ path }),
        })
      }

      async function apiRmdir(prefix) {
        return apiRequest('/rmdir', {
          method: 'POST',
          body: JSON.stringify({ prefix }),
        })
      }

      async function apiMvdir(from, to) {
        return apiRequest('/mvdir', {

        })
      }

      function hideContextMenu() {
        ctxMenuEl.classList.remove('open')
        ctxMenuEl.setAttribute('aria-hidden', 'true')
        ctxMenuEl.replaceChildren()
      }

      function showContextMenu(x, y, items) {
        hideContextMenu()
        if (!items.length) return

        for (const item of items) {
          if (item.separator) {
            const separator = document.createElement('div')
            separator.className = 'ctx-menu-separator'
            ctxMenuEl.appendChild(separator)
            continue
          }

          const button = document.createElement('button')
          button.type = 'button'
          button.className = item.danger
            ? 'ctx-menu-item danger'
            : 'ctx-menu-item'
          button.textContent = item.label
          button.onclick = async (event) => {
            event.stopPropagation()
            hideContextMenu()
            await item.action()
          }
          ctxMenuEl.appendChild(button)
        }

        ctxMenuEl.classList.add('open')
        ctxMenuEl.setAttribute('aria-hidden', 'false')
        ctxMenuEl.style.visibility = 'hidden'

        const rect = ctxMenuEl.getBoundingClientRect()
        const maxLeft = window.innerWidth - rect.width - 8
        const maxTop = window.innerHeight - rect.height - 8
        ctxMenuEl.style.left = `${Math.max(8, Math.min(x, maxLeft))}px`
        ctxMenuEl.style.top = `${Math.max(8, Math.min(y, maxTop))}px`
        ctxMenuEl.style.visibility = 'visible'
      }

      function initContextMenu() {
        document.addEventListener('click', hideContextMenu)
        document.addEventListener('contextmenu', (event) => {
          if (!ctxMenuEl.contains(event.target)) {
            hideContextMenu()
          }
        })
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') hideContextMenu()
        })
        window.addEventListener('scroll', hideContextMenu, true)
        window.addEventListener('blur', hideContextMenu)
      }

      function initGridContextMenu() {
        folderGrid.addEventListener('contextmenu', (event) => {
          if (event.target.closest('.file-card')) return
          if (event.target.closest('.folder-card')) return
          if (event.target.closest('.load-more-card')) return

          event.preventDefault()
          showContextMenu(event.clientX, event.clientY, [
            {

      async function promptCreateFolder() {

      async function renameFileItem(item, type) {

      async function deleteSelectedFiles() {
        if (isAppBusy()) return

        const selections = [...selectedItems.values()]
        if (selections.length === 0) return

        const fileEntries = selections.filter(
          (entry) => entry.kind === 'file' || entry.item,
        )
        const folderEntries = selections.filter(
          (entry) => entry.kind === 'folder',
        )
        const browseEntries = selections.filter(
          (entry) => entry.kind === 'browse',
        )

        const labelForEntry = (entry) => {
          if (entry.kind === 'browse') return entry.browseType
          if (entry.kind === 'folder') return getFolderDisplayName(entry.folder)
          return entry.item.displayName || entry.item.name || '파일'
        }

        const names = selections.map(labelForEntry)
        const preview = names.slice(0, 10).join('\n')
        const extra = names.length > 10 ? `\n... 외 ${names.length - 10}개` : ''
        const message = `선택한 ${selections.length}개 항목을 삭제할까요?\n\n${preview}${extra}\n\n이 작업은 되돌릴 수 없습니다.`
        if (
          !(await uiConfirm(message, {
            title: '선택 항목 삭제',
            danger: true,
          }))
        )
          return

        const selectedFolderPaths = new Set(
          folderEntries.map((entry) => entry.folder),
        )
        const foldersToDelete = folderEntries
          .filter((entry) => {
            const parts = entry.folder.split('/')
            for (let index = 1; index < parts.length; index += 1) {
              if (selectedFolderPaths.has(parts.slice(0, index).join('/'))) {
                return false
              }
            }
            return true
          })
          .sort(
            (a, b) => b.folder.split('/').length - a.folder.split('/').length,
          )

        let success = 0
        let failed = []
        let needsBrowseReload = browseEntries.length > 0

        try {
          await withAppBusy(
            `선택 항목 ${selections.length}개 삭제 중...`,
            async () => {
              const fileResults = await mapWithConcurrency(
                fileEntries,
                20,
                async (entry) => {
                  const key = getItemStorageKey(entry.item, entry.type)
                  const name =
                    entry.item.displayName ||
                    entry.item.name ||
                    key.split('/').pop()
                  try {
                    await apiDelete(key)
                    return { ok: true }
                  } catch (err) {
                    return { ok: false, name, message: err.message }
                  }
                },
              )

              success += fileResults.filter((result) => result.ok).length
              failed.push(...fileResults.filter((result) => !result.ok))

              for (const entry of foldersToDelete) {
                const displayName = getFolderDisplayName(entry.folder)
                try {
                  await apiRmdir(buildFolderPrefix(entry.type, entry.folder))
                  if (
                    activeFolder === entry.folder ||
                    activeFolder?.startsWith(`${entry.folder}/`)
                  ) {
                    activeFolder = null
                  }
                  success += 1
                } catch (err) {
                  failed.push({ name: displayName, message: err.message })
                }
              }

              for (const entry of browseEntries) {
                try {
                  await apiRmdir(`${entry.browseType}/`)
                  if (activeBrowseType === entry.browseType) {
                    activeBrowseType = null
                    activeFolder = null
                  }
                  success += 1
                } catch (err) {
                  failed.push({ name: entry.browseType, message: err.message })
                }
              }

              await refreshAfterCrud({ reloadBrowseTypes: needsBrowseReload })
            },
          )
        } catch (err) {
          await uiAlert(`삭제 실패: ${err.message}`)
          return
        }

        setSidebarStatus(
          `${success}개 항목 삭제 완료${failed.length ? `, ${failed.length}개 실패` : ''}`,
        )

        if (failed.length > 0) {
          const failedNames = failed
            .slice(0, 5)
            .map((result) => `${result.name}: ${result.message}`)
            .join('\n')
          await uiAlert(
            `${failed.length}개 항목 삭제에 실패했습니다.\n\n${failedNames}`,
          )
        }

        updateGridToolbar()
      }

      async function renameBrowseTypeItem(browseType) {
        if (isAppBusy()) return

        const newName = sanitizeNameInput(
          await uiPrompt('새 폴더 이름을 입력하세요.', browseType),
        )
        if (!newName || newName === browseType) return

        try {
